[profile.default]
retries       = 0
fail-fast     = false
failure-output = "immediate-final"

# Tier 0 must stay sub-minute or the developer loop stops being a loop.
#
# The rule is "anything slower than 5s is not a unit test", and the ceiling
# below is what enforces it — a test that blows the budget is killed and the
# run is red, so slowness cannot accumulate quietly.
#
# Note what this profile deliberately does NOT do: filter by test *kind*.
# `kind(lib)` looked like the obvious way to say "unit tests only" and instead
# selected nothing at all, because every test in this repository lives in
# `tests/`. Nextest exits 4 on an empty selection rather than reporting a green
# run over zero tests, which is the only reason that was caught in the first
# hour instead of the first month. The ceiling is the right mechanism; the
# filter was a proxy for it.
[profile.quick]
slow-timeout = { period = "5s", terminate-after = 1 }
fail-fast    = true
# The sandbox's `cpu_limit` and `wall_limit` tests burn a second of CPU or
# wall by construction (ADR-0009 §2) and the macOS smoke runner is 2-3x
# slower than a laptop. They are the `ci` profile's; here they are not run.
# So are the two sweeps that replay every corpus log from several snapshot
# offsets — one in-process, one through the `tau` binary: each is a few
# whole folds of every 5000-entry log, ~2.5 s in debug on a laptop and past
# the ceiling on the smoke runner once the corpus reached ten (#148). The
# `ci` profile's Linux job runs them on every pull request.
# The agent drivers' cancel ladder (ADR-0013 §5) is grace periods long by
# construction: a rung is only reached once the one below it has been given
# its grace, so the whole ladder cannot be exercised inside five seconds.
# The `ci` profile's Linux and macOS jobs run it on every pull request.
# `agent_claude_ladder` is the same ladder through the `claude` driver.
default-filter = '''
not binary(sandbox_limits)
and not binary(agent_ladder)
and not binary(agent_claude_ladder)
and not test(every_corpus_log_replays_from_each_of_its_snapshots)
and not test(tau_snapshot_then_tau_replay_from_matches_every_sidecar)
'''

[profile.ci]
retries        = 0          # a flake is a bug; the flake hunter quarantines, CI does not retry
failure-output = "immediate-final"
slow-timeout   = { period = "60s", terminate-after = 5 }

# One line per test, with the failure output for the ones that failed. Tier 1
# ignores it; the Tier 3 flake hunter (scripts/flake-hunt.sh) reads it to
# compare five runs of this profile test by test.
[profile.ci.junit]
path = "junit.xml"
