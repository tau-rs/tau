# Nextest configuration. See https://nexte.st/docs/configuration/

[profile.default]
# Local dev: retry flaky tests up to twice. nextest's parallel test
# execution exposes timing-sensitive flakes that cargo test
# (single-threaded per binary) masked. Two retries keep the inner
# dev loop snappy without re-running cargo manually.
retries = 2

# Show output for failures even when retries succeed, so flakes are
# visible in local logs.
failure-output = "immediate-final"
success-output = "never"

[profile.ci]
# CI: NO retries. A flake is real signal — surface it. If a test is
# genuinely timing-sensitive in a way that retries could mask, fix
# the test, don't hide the symptom.
#
# Invoked via `cargo nextest run --profile ci ...` in
# .github/workflows/ci.yml.
retries = 0
failure-output = "immediate-final"
success-output = "never"

# Flaky-test quarantine list. Tests matched by these filters continue
# to run but failures are non-blocking (status: pass under nextest's
# "report-on-failure" semantics).
#
# Promotion pattern: when a test fails >=5 times in a rolling 7-day
# window, open a PR adding it here with a link to the flake examples
# and a TODO to root-cause + de-quarantine. See
# docs/how-to/quarantine-flaky-tests.md (Phase 4).
#
# Empty list at v0. Promotion is currently manual; auto-promotion
# from auto-rerun-flaky.yml is a follow-up not in this redesign.

[[profile.ci.overrides]]
filter = 'package(__quarantine_placeholder__)'
# Replace the filter above with a real `test(/<regex>/)` filter when
# quarantining; the placeholder package never matches so this override
# is a no-op until a real entry is added.
#
# When promoting a real test:
# - `retries = N` re-runs N times before declaring failure (masks
#   intermittent flakes while a root-cause investigation is open).
# - `failure-output` accepts `immediate`, `immediate-final`, `final`,
#   `never`. Use `immediate-final` for visibility while quarantined.
# - True "non-blocking" failures (test runs but failure doesn't fail
#   the suite) are NOT natively supported by nextest. Real quarantine
#   workflow: bump `retries`, document the flake in the link list at
#   docs/how-to/quarantine-flaky-tests.md (Phase 4), and rely on
#   auto-rerun-flaky.yml to retry the workflow if a real run hits the
#   flake.
retries = 3
failure-output = "immediate-final"
