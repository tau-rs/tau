name: Setup Rust
description: |
  Install a Rust toolchain (with optional components) and configure
  caching, optional cargo-nextest, sccache, and mold linker. Saves cache
  only on main-branch pushes; PRs read-only.

inputs:
  toolchain:
    description: Rust toolchain version (stable, 1.91, master, etc.)
    required: false
    default: stable
  components:
    description: Comma-separated list of components (rustfmt, clippy)
    required: false
    default: ""
  shared-key:
    description: |
      rust-cache shared-key. Pinned per (os, toolchain). All jobs with
      the same shared-key share one cache entry. Recommended pattern:
      "<os>-<toolchain>", e.g. "linux-stable", "windows-1.91".
    required: false
    default: ""
  cache-key:
    description: |
      DEPRECATED: passed to rust-cache's `key:` parameter as a suffix.
      When `shared-key` is also set, the effective key becomes
      `{shared-key}-{cache-key}`. Use `shared-key` instead; this input
      will be removed after all callers migrate.
    required: false
    default: ""
  with-nextest:
    description: Install cargo-nextest (true / false)
    required: false
    default: "false"
  with-sccache:
    description: Install sccache and set RUSTC_WRAPPER (true / false)
    required: false
    default: "false"
  with-mold:
    description: |
      Install the mold linker (Linux only) and set RUSTFLAGS to use it.
      Ignored on non-Linux runners.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      # Pinned to @stable (a published named ref of the action itself),
      # not @master. @master is a moving target that has caused at least
      # two transient macOS rustup flakes in recent CI history. The
      # `toolchain:` input below independently controls *which* Rust
      # version gets installed (stable / 1.91 / etc.); the @stable
      # action ref is just the action version.
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install mold linker (Linux only)
      if: inputs.with-mold == 'true' && runner.os == 'Linux'
      uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444  # v1

    # sccache disabled on Windows: mozilla-actions/sccache-action@v0.0.10's
    # post-step has a state-handling bug that intermittently fails on
    # `windows-latest` with `Unable to locate executable file: undefined`
    # (the post step can't find the path the install step recorded). Same
    # config works fine on Linux + macOS. Skipping sccache on Windows
    # makes CI deterministic; the cost is small because Windows runs
    # only msrv-check (cargo check, fast) + test-stable, with no
    # cross-job rustc-cache reuse benefit to give up.
    - name: Install sccache
      if: inputs.with-sccache == 'true' && runner.os != 'Windows'
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696  # v0.0.10

    - name: Configure sccache env
      if: inputs.with-sccache == 'true' && runner.os != 'Windows'
      shell: bash
      # Preflight the sccache server before exporting RUSTC_WRAPPER. If
      # the GitHub Actions cache backend is unreachable (transient DNS
      # resolution failures for
      # results-receiver.actions.githubusercontent.com have been observed
      # on the macOS runner pool), sccache --start-server exits non-zero
      # and every subsequent rustc invocation would also fail under
      # RUSTC_WRAPPER=sccache, breaking the whole job. Falling back to a
      # plain rustc build keeps CI green at the cost of a one-job cache
      # miss.
      run: |
        export SCCACHE_GHA_ENABLED=true
        ok=""
        for attempt in 1 2 3; do
          if sccache --start-server 2>/tmp/sccache-startup.log; then
            ok=1
            break
          fi
          echo "sccache --start-server attempt $attempt failed:" >&2
          cat /tmp/sccache-startup.log >&2 || true
          sccache --stop-server >/dev/null 2>&1 || true
          sleep $((attempt * 3))
        done
        if [ -n "$ok" ]; then
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        else
          echo "::warning::sccache server failed to start after 3 attempts (likely GitHub Actions cache backend connectivity flake); continuing without sccache for this job"
        fi

    - name: Install cargo-nextest
      if: inputs.with-nextest == 'true'
      uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2
      with:
        tool: nextest

    - name: Cache cargo registry, target, and sccache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      with:
        # `shared-key` enables cross-job cache sharing per (os, toolchain).
        # The deprecated `key` input acts as a suffix when both are set
        # (effective key = `{shared-key}-{key}`); pure-`key` callers retain
        # legacy per-job caching. Removed once all callers migrate.
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.cache-key }}
        # Save the cache only when running on main (push events to main).
        # PRs restore but don't write — keeps cache stable + avoids
        # PR-specific bloat AND prevents write contention between
        # parallel jobs sharing a key.
        save-if: ${{ github.ref == 'refs/heads/main' }}
