# Tier 1 — every pull request and every merge-queue entry. Budget: < 8 minutes.
#
# The pipeline is a funnel (docs/HANDOFF.md §7-8). Tier 0 is seconds, locally.
# This is minutes, blocking. Tier 2 is deep verification on demand or by path.
# Tier 3 is exhaustive, on a schedule, and opens issues instead of failing
# builds. Nothing expensive is deleted; it is rescheduled downward.
#
# If this workflow creeps past ~8 minutes, the fix is to move a job down a tier,
# not to accept the wait. People batch commits when feedback is slow, and
# batched commits are what makes bisection expensive later.

name: tier1

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tier1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0        # incremental artifacts embed compilation state and defeat caching
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler and
        # its components. Pinning a toolchain in the workflow as well would let
        # CI and developers drift onto different compilers, which is the exact
        # class of difference that shows up as "works on my machine".
        run: rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler and
        # its components. Pinning a toolchain in the workflow as well would let
        # CI and developers drift onto different compilers, which is the exact
        # class of difference that shows up as "works on my machine".
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler and
        # its components. Pinning a toolchain in the workflow as well would let
        # CI and developers drift onto different compilers, which is the exact
        # class of difference that shows up as "works on my machine".
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --workspace --all-features --profile ci
      # nextest does not run doctests; the kernel's docs are where the ABI's
      # reasoning lives, so a doctest that stops compiling is a docs rot signal.
      - run: cargo test --locked --workspace --all-features --doc

  abi-guard:
    name: ABI guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # the diff gate needs the merge base
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler and
        # its components. Pinning a toolchain in the workflow as well would let
        # CI and developers drift onto different compilers, which is the exact
        # class of difference that shows up as "works on my machine".
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-semver-checks

      # Gate 3 of the freeze: the pinned wire format (docs/adr/0004-abi-freeze.md).
      - name: Wire-format snapshots
        run: cargo test --locked -p tau-kernel --all-features --test abi_snapshot --test abi_invariants

      # Gate 2: a diff under kernel/src/abi/ needs an ABI bump or a labelled ADR.
      - name: Diff gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: ./scripts/abi-guard.sh

      # The Rust-API half of the surface, which wire snapshots do not cover.
      # Pre-1.0 this is advisory in effect (0.x minors may break); it is here
      # from the start so it is already wired when 1.0 makes it binding.
      - name: Rust API surface
        if: github.event_name == 'pull_request'
        run: cargo semver-checks --baseline-rev "${{ github.event.pull_request.base.sha }}" -p tau-kernel
        continue-on-error: true

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  # Every Cargo.lock in the repository must still satisfy its manifests. The
  # workspace lockfile is covered incidentally, because every cargo invocation
  # above passes --locked. fuzz/ is not a workspace member (nightly, libFuzzer's
  # C++ runtime), so it carries its own lockfile, and the only job that read it
  # under --locked was Tier 2's fuzz leg — path-triggered on kernel/**. The fuzz
  # crate depends on tau-kernel by path, so a bump to a *kernel* dependency
  # changes what that lockfile must hold while nothing re-locks it: #161 moved
  # the kernel to sha2 0.11, its own PR was green, and #170 was the one that
  # found five red fuzz jobs that had nothing to do with its diff (#171).
  #
  # `cargo metadata --locked` answers it in about a second, with no nightly, no
  # libFuzzer and no build: a stale lock is a resolution fact, so resolution is
  # all it should cost. The workspace lockfile is included even though it is
  # already covered, so the contract is "every lockfile", not "the fuzz one",
  # and so a stale root lock reports here instead of as a red clippy (#164).
  lockfiles:
    name: lockfiles (--locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler.
        run: rustup show active-toolchain
      - name: Every lockfile satisfies its manifests
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null

  macos-smoke:
    name: smoke (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler and
        # its components. Pinning a toolchain in the workflow as well would let
        # CI and developers drift onto different compilers, which is the exact
        # class of difference that shows up as "works on my machine".
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      # Unit-only. Full macOS parity is Tier 2; day-to-day macOS breakage is
      # almost always linkage or path handling, which a smoke run catches.
      - run: cargo nextest run --locked --workspace --all-features --profile quick

  # Tier 1 job 3 (docs/HANDOFF.md §8): the fast determinism check. The `sim`
  # harness drives the reducer with three fixed seeds, folds each log twice
  # more — from memory and through a JSON round-trip — and every fold must
  # hash the same. This is the canary for reducer nondeterminism; the proof is
  # the Tier 2 soak. The quick profile is deliberate: its 5s ceiling is what
  # keeps this "seconds, not minutes", and nextest exits 4 on an empty
  # selection, so a renamed crate cannot make this job pass on nothing.
  determinism:
    name: determinism (3 seeds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler and
        # its components. Pinning a toolchain in the workflow as well would let
        # CI and developers drift onto different compilers, which is the exact
        # class of difference that shows up as "works on my machine".
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked -p tau-sim --all-features --profile quick

  # Tier 1 job 6 (docs/HANDOFF.md §8): the coverage ratchet. Line coverage may
  # not drop more than 0.5 points against the commit being merged onto. There is
  # no stored baseline: the script checks the base out into a throwaway
  # worktree and measures both sides in this run, sharing the dependency build
  # through the target dir. A committed number would be a status file that
  # rots; an artifact would need a first run to exist. The script fails closed
  # on an empty selection, a zero line count, or an unresolvable base, and it
  # runs on every event so the fan-in never sees it 'skipped'.
  coverage:
    name: coverage (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # the ratchet needs the parent commit's tree
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler and
        # its components. Pinning a toolchain in the workflow as well would let
        # CI and developers drift onto different compilers, which is the exact
        # class of difference that shows up as "works on my machine".
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: ./scripts/coverage-ratchet.sh

  # A single required check, so branch protection does not have to enumerate
  # the matrix. Adding a job above means adding it to `needs` here — and
  # `result == success` for *every* need, because a skipped job reports
  # 'skipped', not 'failure', and a gate that treats skipped as passing is a
  # gate that fails open.
  tier1:
    name: tier1
    runs-on: ubuntu-latest
    if: always()
    needs: [fmt, clippy, test, abi-guard, deny, lockfiles, macos-smoke, determinism, coverage]
    steps:
      - name: Require every Tier 1 job to have succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::a Tier 1 job reported '$r'"
              exit 1
            fi
          done
