# Tier 2 — deep verification (docs/HANDOFF.md §8). On demand, or by path.
#
# Tier 1 is the fast lane every PR pays for. This is the slow lane the frozen
# parts of the system get automatically: a PR that touches `kernel/**` runs
# it without being asked, any PR runs it under the `deep-ci` label, and it
# runs on every push to main that touches the reducer or the harness. It is
# not in the `tier1` fan-in and is not a required check; if it must gate a
# merge, label the PR and wait for it.
#
# Today this is items 1 to 5 of the seven. The simulation soak: 10^6 events
# on Linux, refolded on the same build, then refolded on macOS from the log
# the Linux job uploaded. ADR-0003 calls the second half the check that
# catches what a single machine never sees — iteration-order and formatting
# differences that only show up on another platform. The property tests,
# cranked: the four ADR-0002 properties over arbitrary trees, at a case count
# `just check` could never afford. Fuzzing: fifteen minutes per target on the
# paths attacker-controlled bytes enter by — the envelope, the log file, the
# model reply, and the rule text. The platform matrix: the full suite on macOS, and the
# Linux suite on both the pinned toolchain and beta. And the sanitizers: ASan
# with LSan over the kernel's tests and over the sandbox driver and its
# shim, TSan over everything that boots a `Kernel` on tokio. The other two
# items are tracked in their own issues (refs #6).

name: tier2

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "sim/**"
      - "drivers/src/sandbox/**"
  workflow_dispatch:
    inputs:
      events:
        description: Accepted entries to generate
        default: "1000000"
        required: false
      seed:
        description: Generator seed (decimal)
        default: "20260914"
        required: false

permissions:
  contents: read

concurrency:
  group: tier2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  SOAK_EVENTS: ${{ github.event.inputs.events || '1000000' }}
  SOAK_SEED: ${{ github.event.inputs.seed || '20260914' }}

jobs:
  # Decides whether a pull request pays for the slow lane: the `deep-ci`
  # label, or a diff under kernel/** or drivers/src/sandbox/** (the one
  # place the system runs code it did not write). Pushes and manual runs
  # always do.
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'deep-ci') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$LABELLED" = "true" ]; then
            echo "deep-ci label present"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(kernel/|drivers/src/sandbox/)'; then
            echo "kernel/** or drivers/src/sandbox/** changed"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "no label, no kernel or sandbox diff: skipping"
          echo "run=false" >> "$GITHUB_OUTPUT"

  soak-linux:
    name: soak (linux, 10^6 events)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler.
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release -p tau-sim --bin soak
      - name: Soak and refold on this build
        run: |
          set -euo pipefail
          mkdir -p soak
          SECONDS=0
          ./target/release/soak soak \
            --seed "$SOAK_SEED" --events "$SOAK_EVENTS" \
            --log soak/log.jsonl --hash soak/hash.txt | tee soak/summary.txt
          echo "linux soak+refold: ${SECONDS}s"
          {
            echo "## soak (linux)"
            echo
            echo "- events requested: $SOAK_EVENTS, seed $SOAK_SEED"
            echo "- $(cat soak/summary.txt)"
            echo "- run + same-build refold: ${SECONDS}s"
            echo "- log: $(du -h soak/log.jsonl | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-log
          path: soak/
          retention-days: 7
          if-no-files-found: error

  # The cross-platform half: fold the Linux log on macOS, expect the same hash.
  refold-macos:
    name: refold (macos)
    needs: soak-linux
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release -p tau-sim --bin soak
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soak-log
          path: soak/
      - name: Refold the Linux log
        run: |
          set -euo pipefail
          SECONDS=0
          ./target/release/soak refold --log soak/log.jsonl --expect soak/hash.txt | tee refold.txt
          echo "macos refold: ${SECONDS}s"
          {
            echo "## refold (macos)"
            echo
            echo "- $(cat refold.txt)"
            echo "- expected: $(cat soak/hash.txt)"
            echo "- fold of the Linux log: ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Item 1: the four properties (ADR-0002) over arbitrary trees, 10^5 cases
  # each. `sim/tests/properties.rs` reads the count from PROPTEST_CASES and
  # defaults to a few dozen so the developer loop stays fast; this is the
  # same test with the budget it deserves. `cargo test`, not nextest: the ci
  # profile's per-test ceiling is sized for Tier 1, and the four tests share
  # the runner's cores either way.
  proptest-cranked:
    name: proptest (cranked, 10^5 cases)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROPTEST_CASES: 100000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --release -p tau-sim --test properties --no-run
      - name: Run the properties
        run: |
          set -euo pipefail
          SECONDS=0
          cargo test --locked --release -p tau-sim --test properties | tee proptest.txt
          echo "proptest at $PROPTEST_CASES cases: ${SECONDS}s"
          {
            echo "## proptest (cranked)"
            echo
            echo "- cases per property: $PROPTEST_CASES"
            echo "- $(grep '^test result' proptest.txt)"
            echo "- wall: ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"
  # Item 3: fuzzing, 15 minutes per target. Model output is attacker-
  # controlled input, so the targets are the exact paths bytes from outside
  # enter by (fuzz/fuzz_targets/). The seed corpora are committed; what
  # libFuzzer grows is not kept — corpus persistence is Tier 3 (#7). A crash
  # is kept: the reproducer is uploaded so the failure can be replayed.
  #
  # cargo-fuzz needs nightly for the sanitizer flags. Nightly is installed
  # beside the pinned toolchain and named per invocation; rust-toolchain.toml
  # stays the single source of truth for everything else. RUSTFLAGS is
  # cleared for this job: `-D warnings` on a moving nightly would make it
  # red for lint churn in kernel/, which is the toolchain canary's job (#7),
  # not this one's. The fuzz crate itself is held to clippy separately below.
  fuzz:
    name: fuzz (${{ matrix.target }}, 15 min)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [msg-envelope, log-read-from, decode-reply-bytes, decode-reply-hostile, rule-parse]
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly beside the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
          cargo +nightly --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-fuzz
      - name: Lockfile is current, targets are clean
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo +nightly fetch --locked
          cargo +nightly fmt --all --check
          cargo +nightly clippy --all-targets --locked -- -D warnings
      - name: Fuzz
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # cargo-fuzz defaults `--target` to the triple *it* was built for,
          # and install-action ships a static musl binary; ASan does not
          # exist for musl. Name the host triple so the build follows rustc.
          HOST="$(rustc +nightly -vV | sed -n 's/^host: //p')"
          mkdir -p "corpus/$TARGET"
          SECONDS=0
          cargo +nightly fuzz run --target "$HOST" "$TARGET" "corpus/$TARGET" "seeds/$TARGET" -- \
            -max_total_time=900 -print_final_stats=1 2>&1 | tee fuzz.log
          {
            echo "## fuzz ($TARGET)"
            echo
            echo "- seeds: $(ls "seeds/$TARGET" | wc -l), corpus grown to: $(ls "corpus/$TARGET" | wc -l)"
            echo "- $(grep -E '^#[0-9]+\s+DONE' fuzz.log | tail -1 || echo 'no DONE line')"
            echo "- wall: ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/fuzz.log
          retention-days: 7
          if-no-files-found: warn

  # Tier 2 item 4, first half: the complete suite on macOS. Tier 1's macOS
  # job is unit-only under the quick profile; this is the ci profile plus
  # doctests, the same pair the Linux `test` job runs on every PR.
  full-macos:
    name: full (macos)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler.
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      - name: Full suite
        run: |
          set -euo pipefail
          SECONDS=0
          cargo nextest run --locked --workspace --all-features --profile ci
          nextest_s=$SECONDS; SECONDS=0
          cargo test --locked --workspace --all-features --doc
          {
            echo "## full (macos)"
            echo
            echo "- $(rustc --version)"
            echo "- nextest (ci profile): ${nextest_s}s"
            echo "- doctests: ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tier 2 item 4, second half: the Linux suite on the pinned toolchain and
  # on beta. Stable is a gate like any other Tier 2 job. Beta is early
  # warning, not a gate: `continue-on-error` keeps it from failing the run,
  # and the last step writes what happened to the step summary so a new
  # rustc or clippy lint is seen the week it lands in beta rather than the
  # week the pin moves. Clippy runs here on purpose — RUSTFLAGS covers new
  # rustc lints, but new clippy lints only show up under clippy itself.
  linux-toolchains:
    name: toolchain (${{ matrix.toolchain }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler.
        # The `stable` leg is that pin, not the stable channel.
        run: rustup show active-toolchain
      - name: Override with beta for this job only
        if: matrix.toolchain == 'beta'
        run: |
          set -euo pipefail
          rustup toolchain install beta --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=beta" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      - id: clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - id: nextest
        run: cargo nextest run --locked --workspace --all-features --profile ci
      - id: doctests
        run: cargo test --locked --workspace --all-features --doc
      - name: Report
        if: always()
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          CLIPPY: ${{ steps.clippy.outcome }}
          NEXTEST: ${{ steps.nextest.outcome }}
          DOCTESTS: ${{ steps.doctests.outcome }}
        run: |
          set -euo pipefail
          version=$(rustc --version)
          {
            echo "## toolchain ($TOOLCHAIN)"
            echo
            echo "- $version"
            echo "- clippy: $CLIPPY"
            echo "- nextest (ci profile): $NEXTEST"
            echo "- doctests: $DOCTESTS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOOLCHAIN" = "beta" ] && [ "$CLIPPY$NEXTEST$DOCTESTS" != "successsuccesssuccess" ]; then
            echo "::warning title=beta toolchain::$version failed (clippy=$CLIPPY nextest=$NEXTEST doctests=$DOCTESTS); early warning, not a gate"
          fi

  # Item 5: the sanitizers. Two legs, both on nightly because `-Zsanitizer`
  # and `-Zbuild-std` are unstable, both on x86_64 Linux because that is
  # where every sanitizer runtime exists. The std rebuild is what makes the
  # runtime see allocations std makes on the crate's behalf; without it the
  # instrumented code sits on an uninstrumented std and half the faults are
  # invisible. `--target` is named explicitly so RUSTFLAGS does not reach
  # build scripts and proc macros, which run on the host and must not be
  # instrumented. Same nightly-beside-the-pin and cleared-RUSTFLAGS
  # rationale as the fuzz job above; the sanitizer flag goes on the run step
  # so the cache key and the job's env stay honest about what they hold.
  #
  # ASan with LSan over `tau-kernel`. The workspace forbids `unsafe`, so the
  # class of fault this leg hunts is a leak or a use-after-free reachable
  # through a dependency, not through code in this repository. LSan is on by
  # default with ASan on Linux x86_64: a leaked test process exits non-zero
  # at teardown and nextest reports it as a failure. The red-proof for that
  # claim is a scratch PR linked from #38.
  #
  # A report is only worth reading if its frames name a call site. The
  # sanitizer runtime symbolizes through a bare `llvm-symbolizer` on PATH,
  # and the runner ships only versioned ones (`llvm-symbolizer-18`, under
  # `/usr/lib/llvm-18/bin/` with the bare name); rustup's `llvm-tools`
  # component does not carry one at all. So each ASan leg finds the newest
  # the image has and hands it to the runtime as `external_symbolizer_path`
  # through `ASAN_OPTIONS`, which nextest passes to every test process and
  # the sandbox test helper forwards into the shim's scrubbed environment.
  # The symbolizer's LLVM being older than rustc's is fine: it reads DWARF,
  # not IR. The red-proof for file:line frames in both legs is a scratch PR
  # linked from #64.
  asan-kernel:
    name: asan+lsan (kernel)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""
      SAN_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly beside the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo +nightly --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: asan
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      - name: Point the sanitizer runtime at a symbolizer
        run: |
          set -euo pipefail
          symbolizer="$(command -v llvm-symbolizer || true)"
          if [ -z "$symbolizer" ]; then
            symbolizer="$(printf '%s\n' /usr/lib/llvm-*/bin/llvm-symbolizer | sort -V | tail -1)"
          fi
          if ! [ -x "$symbolizer" ]; then
            echo "::error title=asan::no llvm-symbolizer on this runner; LSan frames would be bare addresses"
            exit 1
          fi
          "$symbolizer" --version
          echo "ASAN_OPTIONS=external_symbolizer_path=$symbolizer" >> "$GITHUB_ENV"
          echo "SYMBOLIZER=$symbolizer" >> "$GITHUB_ENV"
      - name: Kernel tests under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          set -euo pipefail
          SECONDS=0
          cargo +nightly nextest run --locked -Zbuild-std \
            -p tau-kernel --all-features --profile ci --target "$SAN_TARGET" 2>&1 | tee asan.log
          {
            echo "## asan+lsan (kernel)"
            echo
            echo "- $(grep -E '^\s+Summary' asan.log | tail -1 | sed 's/^ *//')"
            echo "- symbolizer: $SYMBOLIZER"
            echo "- wall (build-std + run): ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # TSan over the tokio-facing layer: `kernel/src/kernel.rs` and the
  # scheduler path, which only run under a spawner. Whole crates, not a
  # hand-picked filter: a filter naming the nine files that boot a `Kernel`
  # today would rot silently the day one is renamed, and a pure reducer test
  # under TSan costs nothing but compile time. `libtau` and `tau-drivers`
  # are the kernel's first tokio-native consumers; their kernel tests are
  # where the scheduler is actually driven. The live driver tests skip
  # themselves without TAU_*_LIVE=1, so no network is needed.
  tsan-scheduler:
    name: tsan (scheduler)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""
      SAN_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly beside the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo +nightly --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: tsan
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      - name: Kernel-booting tests under ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
        run: |
          set -euo pipefail
          SECONDS=0
          # The sandbox tests spawn the instrumented shim as a real process,
          # and a sanitizer runtime inside an rlimit fence is its own
          # problem: the shadow mapping does not fit under RLIMIT_AS, and a
          # deferred SIGTERM misses the abandon grace. That leg is
          # `asan+lsan (sandbox)` below, with its own flags; this job stays
          # the scheduler's.
          cargo +nightly nextest run --locked -Zbuild-std \
            -p tau-kernel -p libtau -p tau-drivers --all-features --profile ci \
            -E 'not binary(/^sandbox_/)' \
            --target "$SAN_TARGET" 2>&1 | tee tsan.log
          {
            echo "## tsan (scheduler)"
            echo
            echo "- $(grep -E '^\s+Summary' tsan.log | tail -1 | sed 's/^ *//')"
            echo "- wall (build-std + run): ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # ASan with LSan over the trust boundary: the sandbox driver and the shim
  # it spawns, which is the one place the system runs code it did not write
  # (ADR-0009 §4). `-p tau-drivers` instruments the test binaries and the
  # shim alike; the four `sandbox_*` binaries are the ones that exercise
  # them. One thing the sanitizer runtime cannot live with, learned from
  # the TSan job before it filtered the sandbox out (#61): a memory bound.
  # ASan reserves terabytes of address space for its shadow mapping, which
  # no `RLIMIT_AS` a test would set can hold, so the one test that sets
  # `memory_bytes` is excluded by name here and says so at its definition;
  # every other run goes unbounded. The deferred SIGTERM that missed the
  # abandon grace under TSan does not recur under ASan, whose runtime is
  # cheap to start: cancel, drop and wall run with the driver's defaults.
  asan-sandbox:
    name: asan+lsan (sandbox)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: ""
      SAN_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly beside the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --component rust-src
          cargo +nightly --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: asan-sandbox
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-nextest
      # Same step as `asan+lsan (kernel)`; the why is written there. Here it
      # reaches two binaries: nextest hands `ASAN_OPTIONS` to the test
      # process, and `drivers/tests/common/sandbox.rs` forwards it into the
      # shim, whose environment the driver otherwise scrubs (ADR-0009 §4).
      - name: Point the sanitizer runtime at a symbolizer
        run: |
          set -euo pipefail
          symbolizer="$(command -v llvm-symbolizer || true)"
          if [ -z "$symbolizer" ]; then
            symbolizer="$(printf '%s\n' /usr/lib/llvm-*/bin/llvm-symbolizer | sort -V | tail -1)"
          fi
          if ! [ -x "$symbolizer" ]; then
            echo "::error title=asan::no llvm-symbolizer on this runner; LSan frames would be bare addresses"
            exit 1
          fi
          "$symbolizer" --version
          echo "ASAN_OPTIONS=external_symbolizer_path=$symbolizer" >> "$GITHUB_ENV"
          echo "SYMBOLIZER=$symbolizer" >> "$GITHUB_ENV"
      - name: Sandbox driver and shim under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          set -euo pipefail
          SECONDS=0
          cargo +nightly nextest run --locked -Zbuild-std \
            -p tau-drivers --all-features --profile ci \
            -E 'binary(/^sandbox_/) and not test(a_memory_bound_reaches_the_shim_and_a_small_run_fits_under_it)' \
            --target "$SAN_TARGET" 2>&1 | tee asan-sandbox.log
          {
            echo "## asan+lsan (sandbox)"
            echo
            echo "- $(grep -E '^\s+Summary' asan-sandbox.log | tail -1 | sed 's/^ *//')"
            echo "- symbolizer: $SYMBOLIZER"
            echo "- wall (build-std + run): ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"
