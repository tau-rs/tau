# Tier 2 — deep verification (docs/HANDOFF.md §8). On demand, or by path.
#
# Tier 1 is the fast lane every PR pays for. This is the slow lane the frozen
# parts of the system get automatically: a PR that touches `kernel/**` runs
# it without being asked, any PR runs it under the `deep-ci` label, and it
# runs on every push to main that touches the reducer or the harness. It is
# not in the `tier1` fan-in and is not a required check; if it must gate a
# merge, label the PR and wait for it.
#
# Today this is items 2 and 3 of the seven. The simulation soak: 10^6 events
# on Linux, refolded on the same build, then refolded on macOS from the log
# the Linux job uploaded. ADR-0003 calls the second half the check that
# catches what a single machine never sees — iteration-order and formatting
# differences that only show up on another platform. And fuzzing: fifteen
# minutes per target on the paths attacker-controlled bytes enter by — the
# envelope, the log file, and the model reply. The other five items are
# tracked in their own issues (refs #6).

name: tier2

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "sim/**"
  workflow_dispatch:
    inputs:
      events:
        description: Accepted entries to generate
        default: "1000000"
        required: false
      seed:
        description: Generator seed (decimal)
        default: "20260914"
        required: false

permissions:
  contents: read

concurrency:
  group: tier2-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  SOAK_EVENTS: ${{ github.event.inputs.events || '1000000' }}
  SOAK_SEED: ${{ github.event.inputs.seed || '20260914' }}

jobs:
  # Decides whether a pull request pays for the slow lane: the `deep-ci`
  # label, or a diff under kernel/**. Pushes and manual runs always do.
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'deep-ci') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$LABELLED" = "true" ]; then
            echo "deep-ci label present"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^kernel/'; then
            echo "kernel/** changed"
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "no label, no kernel diff: skipping"
          echo "run=false" >> "$GITHUB_OUTPUT"

  soak-linux:
    name: soak (linux, 10^6 events)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler.
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release -p tau-sim --bin soak
      - name: Soak and refold on this build
        run: |
          set -euo pipefail
          mkdir -p soak
          SECONDS=0
          ./target/release/soak soak \
            --seed "$SOAK_SEED" --events "$SOAK_EVENTS" \
            --log soak/log.jsonl --hash soak/hash.txt | tee soak/summary.txt
          echo "linux soak+refold: ${SECONDS}s"
          {
            echo "## soak (linux)"
            echo
            echo "- events requested: $SOAK_EVENTS, seed $SOAK_SEED"
            echo "- $(cat soak/summary.txt)"
            echo "- run + same-build refold: ${SECONDS}s"
            echo "- log: $(du -h soak/log.jsonl | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soak-log
          path: soak/
          retention-days: 7
          if-no-files-found: error

  # The cross-platform half: fold the Linux log on macOS, expect the same hash.
  refold-macos:
    name: refold (macos)
    needs: soak-linux
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release -p tau-sim --bin soak
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soak-log
          path: soak/
      - name: Refold the Linux log
        run: |
          set -euo pipefail
          SECONDS=0
          ./target/release/soak refold --log soak/log.jsonl --expect soak/hash.txt | tee refold.txt
          echo "macos refold: ${SECONDS}s"
          {
            echo "## refold (macos)"
            echo
            echo "- $(cat refold.txt)"
            echo "- expected: $(cat soak/hash.txt)"
            echo "- fold of the Linux log: ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # Item 3: fuzzing, 15 minutes per target. Model output is attacker-
  # controlled input, so the targets are the exact paths bytes from outside
  # enter by (fuzz/fuzz_targets/). The seed corpora are committed; what
  # libFuzzer grows is not kept — corpus persistence is Tier 3 (#7). A crash
  # is kept: the reproducer is uploaded so the failure can be replayed.
  #
  # cargo-fuzz needs nightly for the sanitizer flags. Nightly is installed
  # beside the pinned toolchain and named per invocation; rust-toolchain.toml
  # stays the single source of truth for everything else. RUSTFLAGS is
  # cleared for this job: `-D warnings` on a moving nightly would make it
  # red for lint churn in kernel/, which is the toolchain canary's job (#7),
  # not this one's. The fuzz crate itself is held to clippy separately below.
  fuzz:
    name: fuzz (${{ matrix.target }}, 15 min)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [msg-envelope, log-read-from, decode-reply-bytes, decode-reply-hostile]
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly beside the pinned toolchain
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --component clippy --component rustfmt
          cargo +nightly --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-fuzz
      - name: Lockfile is current, targets are clean
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo +nightly fetch --locked
          cargo +nightly fmt --all --check
          cargo +nightly clippy --all-targets --locked -- -D warnings
      - name: Fuzz
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "corpus/$TARGET"
          SECONDS=0
          cargo +nightly fuzz run "$TARGET" "corpus/$TARGET" "seeds/$TARGET" -- \
            -max_total_time=900 -print_final_stats=1 2>&1 | tee fuzz.log
          {
            echo "## fuzz ($TARGET)"
            echo
            echo "- seeds: $(ls "seeds/$TARGET" | wc -l), corpus grown to: $(ls "corpus/$TARGET" | wc -l)"
            echo "- $(grep -E '^#[0-9]+\s+DONE' fuzz.log | tail -1 || echo 'no DONE line')"
            echo "- wall: ${SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/fuzz.log
          retention-days: 7
          if-no-files-found: warn
