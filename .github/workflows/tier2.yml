name: Tier 2 — Heavy validation

# Runs on:
# - nightly cron 04:00 UTC against main HEAD (regression detection ≤24h)
# - pull_request labeled `full-matrix` (opt-in pre-merge heavy run)
# - workflow_dispatch (manual)
#
# Tier 2 is NON-BLOCKING for PR merge. Auto-merge fires on Tier 0
# (ci-summary) green; Tier 2 results are informational, posted as PR
# comments or — on cron — as rolling regression issues.

on:
  schedule:
    - cron: '0 4 * * *'
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
  workflow_call:  # release.yml reuses this workflow for preflight

concurrency:
  group: tier2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    # For pull_request triggers, only run downstream jobs when the
    # `full-matrix` label is present. For schedule + workflow_dispatch,
    # always run.
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.compute.outputs.run }}
    steps:
      - id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$LABELS" | grep -q '"full-matrix"'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-fixtures-linux:
    # Self-contained: build the fixture binaries inside this workflow
    # rather than downloading from ci.yml's artifact (avoids cross-
    # workflow race conditions when ci.yml hasn't yet uploaded).
    name: build-fixtures / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-mold: true
      - name: Build all release-mode binaries
        run: |
          cargo build --release \
            -p anthropic -p ollama -p openai \
            -p fs-read -p shell \
            -p echo-llm -p echo-tool \
            -p tau-cli
          cargo build --release \
            -p tau-sandbox-native --bin tau-net-bridge
      - name: Build controlled-env binary
        run: |
          cargo build --release \
            --manifest-path crates/tau-plugin-compat/fixtures/controlled-env-binary/Cargo.toml
      - name: Stage binaries into flat _artifacts directory
        run: |
          mkdir -p _artifacts
          cp target/release/anthropic-plugin _artifacts/
          cp target/release/ollama-plugin _artifacts/
          cp target/release/openai-plugin _artifacts/
          cp target/release/fs-read-plugin _artifacts/
          cp target/release/shell-plugin _artifacts/
          cp target/release/echo-llm _artifacts/
          cp target/release/echo-tool _artifacts/
          cp target/release/tau _artifacts/
          cp target/release/tau-net-bridge _artifacts/
          cp crates/tau-plugin-compat/fixtures/controlled-env-binary/target/release/tau-controlled-env _artifacts/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: tier2-linux-fixture-binaries
          retention-days: 1
          path: _artifacts/

  nextest-macos:
    name: nextest / macos
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: macos-latest-stable
          with-nextest: true
          with-sccache: true
      # --no-fail-fast: nightly is a comprehensive regression sweep — surface
      # EVERY failing test in one run rather than stopping at the first, so a
      # single cron (and its auto-bisect) sees the whole picture.
      # --retries 2: the shared macOS/Windows runners are loaded and several
      # e2e tests are timing-sensitive; retries absorb transient flakes while a
      # genuine break still fails all 3 attempts. (Tier 0 stays retries=0 for
      # hard signal on the fast lane.)
      - run: cargo nextest run --profile ci --workspace --all-targets --no-fail-fast --retries 2

  nextest-windows:
    name: nextest / windows
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: windows-latest-stable
          with-nextest: true
      # --no-fail-fast + --retries 2: see nextest-macos above.
      - run: cargo nextest run --profile ci --workspace --all-targets --no-fail-fast --retries 2

  coverage:
    name: cargo llvm-cov nextest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: llvm-tools-preview
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@492cad282ff2bc751208d9bdcbbcce57c3a90925  # cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov nextest --profile ci --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false

  test-conformance:
    name: test (conformance)
    needs: [gate, build-fixtures-linux]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
      - uses: ./.github/actions/place-fixture-binaries
        with:
          binaries: "anthropic-plugin ollama-plugin openai-plugin"
      - name: Run conformance suite against all 3 plugins
        run: |
          cargo nextest run --profile ci -p anthropic --test conformance --no-capture
          cargo nextest run --profile ci -p ollama    --test conformance --no-capture
          cargo nextest run --profile ci -p openai    --test conformance --no-capture

  test-tau-plugin-compat:
    name: test (tau-plugin-compat / linux)
    needs: [gate, build-fixtures-linux]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      TAU_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-mold: true
      - uses: ./.github/actions/place-fixture-binaries
        with:
          binaries: "all"
      - name: Build tau binary (debug)
        run: cargo build -p tau-cli --bin tau
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          driver: docker-container
      - name: Build per-plugin images
        run: cargo run -p xtask -- build-plugin-images
        env:
          BUILDX_CACHE_FROM: type=gha
          BUILDX_CACHE_TO: type=gha,mode=max
          BUILDKIT_PROGRESS: plain
          DOCKER_BUILDKIT: "1"
      - name: Test tau-plugin-compat
        run: cargo nextest run --profile ci -p tau-plugin-compat --features integration-tests --tests --verbose

  test-tau-plugin-compat-layer4-ignored:
    name: test (tau-plugin-compat / layer4-ignored / ${{ matrix.flavor }})
    needs: [gate, build-fixtures-linux]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [native, container]
    env:
      TAU_CONTAINER_RUNTIME: docker
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-mold: true
      - uses: ./.github/actions/place-fixture-binaries
        with:
          binaries: "all"
      - name: Set up Docker buildx
        if: matrix.flavor == 'container'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4
        with:
          driver: docker-container
      - name: Build per-plugin images
        if: matrix.flavor == 'container'
        run: cargo run -p xtask -- build-plugin-images
        env:
          BUILDX_CACHE_FROM: type=gha
          BUILDX_CACHE_TO: type=gha,mode=max
          BUILDKIT_PROGRESS: plain
          DOCKER_BUILDKIT: "1"
      - name: Build NEXTEST_FILTER for this leg
        run: |
          if [ "$FLAVOR" = "native" ]; then
            echo 'NEXTEST_FILTER=not (test(/anthropic_layer4_native_completes_via_cassette/) | test(/ollama_layer4_native_completes_via_cassette/) | test(/openai_layer4_native_completes_via_cassette/))' >> "$GITHUB_ENV"
          else
            echo 'NEXTEST_FILTER=all()' >> "$GITHUB_ENV"
          fi
      - name: Run ignored layer4 tests
        run: |
          cargo nextest run --profile ci \
            -p tau-plugin-compat \
            --features integration-tests \
            --run-ignored only \
            --test "layer4_$FLAVOR" \
            -E "$NEXTEST_FILTER" \
            --verbose

  test-tau-sandbox-native-e2e:
    name: test (tau-sandbox-native e2e / linux)
    needs: [gate, build-fixtures-linux]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-mold: true
      - uses: ./.github/actions/place-fixture-binaries
        with:
          binaries: "tau-controlled-env"
      - name: Test tau-sandbox-native e2e
        run: cargo nextest run --profile ci -p tau-sandbox-native --features integration-tests --tests --verbose
      - name: Run --ignored landlock-gated tests
        run: cargo nextest run --profile ci -p tau-sandbox-native --features integration-tests --run-ignored only --verbose

  test-tau-runtime-e2e:
    name: test (tau-runtime e2e / linux)
    needs: [gate, build-fixtures-linux]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-mold: true
      - uses: ./.github/actions/place-fixture-binaries
        with:
          binaries: "tau-controlled-env"
      - name: Test tau-runtime-tokio e2e
        run: cargo nextest run --profile ci -p tau-runtime-tokio --features integration-tests --tests --verbose

  msrv-check:
    # MSRV is a rustc-version property, not an OS property. Moved from
    # per-PR ci.yml to nightly (ADR-0063): breaks are rare and bisect
    # finds them trivially. release.yml re-asserts MSRV on tags.
    name: msrv-check / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          shared-key: linux-1.91
          with-sccache: true
          with-mold: true
      - run: cargo check --workspace --all-targets --locked

  test-fixtures-ports:
    name: test-fixtures-ports / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
      - name: Test tau-ports (test-fixtures feature only)
        run: cargo nextest run --profile ci -p tau-ports --features test-fixtures
      - name: Doctests tau-ports (test-fixtures feature only)
        # Workspace-level `cargo test --workspace --doc` (ci.yml doc-tests)
        # runs doctests without features; the fixtures module is gated
        # behind `test-fixtures`, so its doctests only compile here.
        run: cargo test --doc -p tau-ports --features test-fixtures

  conformance:
    # β.6 conformance gate on the tau-conformance crate. Distinct from
    # test-conformance above (plugin conformance suites).
    name: conformance / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
      - name: Run β.6 conformance gate (dev profile)
        # The #[ignore]'d wasm-profile test is skipped by nextest until
        # β.7.5 ships `tau build wasm`. See ADR-0048.
        run: cargo nextest run --profile ci -p tau-conformance

  test-credential-chain:
    name: test-credential-chain / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
      - name: Credential port tests (tau-ports)
        run: cargo nextest run --profile ci -p tau-ports -E 'test(/credential/)'
      - name: Credential provider tests (tau-runtime-tokio)
        run: cargo nextest run --profile ci -p tau-runtime-tokio -E 'test(/credentials/)'

  feature-flag-matrix:
    name: feature-flag-matrix / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      - name: Check each crate with --no-default-features
        run: |
          set -e
          for crate in tau-domain tau-ports tau-pkg tau-runtime-tokio tau-cli tau-plugin-protocol tau-plugin-sdk tau-mcp tau-observe tau-native-tools; do
            echo "::group::$crate"
            cargo check -p "$crate" --no-default-features
            echo "::endgroup::"
          done
      - name: tau-ports feature quadrants (serde / process independence)
        # `process = ["serde?/std"]` in crates/tau-ports/Cargo.toml makes serde an
        # OPTIONAL dep of process. Verify each feature builds WITHOUT the other so
        # a consumer that enables only one never hits a missing-item error that the
        # default (both-on) matrix would mask.
        run: |
          set -e
          cargo check -p tau-ports --no-default-features --features serde
          cargo check -p tau-ports --no-default-features --features process

  mock-sandbox-prod-gate:
    name: mock-sandbox absent from default tau binary / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      - name: MockSandbox must not be reachable in a default tau build
        # The `mock-sandbox` feature (tau-runtime-tokio) makes the
        # `TAU_TESTING_ALLOW_MOCK_SANDBOX=1` capability-gate bypass reachable.
        # It is enabled ONLY via dev-dependencies, so under resolver v2 a
        # default `cargo build` of the `tau` binary must contain neither the
        # mock code path nor the env-var string literal. A hit here means the
        # feature leaked into the production dependency graph (e.g. moved from a
        # dev-dep to a normal dep) or the
        # `#[cfg(any(feature = "mock-sandbox", test))]` gates in
        # process_gate::resolver were dropped.
        run: |
          set -euo pipefail
          cargo build -p tau-cli
          BIN=target/debug/tau
          if strings "$BIN" | grep -q 'TAU_TESTING_ALLOW_MOCK_SANDBOX'; then
            echo "::error::mock-sandbox leaked into the default tau binary — the TAU_TESTING_ALLOW_MOCK_SANDBOX gate is reachable in production" >&2
            strings "$BIN" | grep 'TAU_TESTING_ALLOW_MOCK_SANDBOX' >&2 || true
            exit 1
          fi
          echo "OK: no mock-sandbox env gate in the default tau binary"

  build-checks-linux:
    name: build-checks / linux
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
      - name: Build tau-plugin-test-support
        run: cargo build -p tau-plugin-test-support
      - name: Test tau-plugin-test-support
        run: cargo nextest run --profile ci -p tau-plugin-test-support --all-targets
      - name: Build tau-plugin-conformance
        run: cargo build -p tau-plugin-conformance
      - name: Build tau-plugin-compat
        run: cargo build -p tau-plugin-compat
      - name: Build tau-plugin-compat (integration-tests feature)
        run: cargo build -p tau-plugin-compat --features integration-tests --tests

  schema-conformance:
    name: IR schema (drift + conformance)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      - name: Drift check + conformance kit validation
        run: cargo test -p tau-ir --features schema --test schema_export --test schema_conformance

  wit-host-drift:
    name: WIT host world (drift + freeze)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      - name: WIT host world drift + freeze test
        run: cargo test -p tau-wasm-host --test wit_host_drift

  nightly-regression-handler:
    # Opens or updates a rolling issue on cron failure. Skips for PR-
    # labeled runs (those report via PR comment from a separate workflow).
    name: nightly-regression-handler
    needs:
      - nextest-macos
      - nextest-windows
      - coverage
      - test-conformance
      - test-tau-plugin-compat
      - test-tau-plugin-compat-layer4-ignored
      - test-tau-sandbox-native-e2e
      - test-tau-runtime-e2e
      - msrv-check
      - test-fixtures-ports
      - conformance
      - test-credential-chain
      - feature-flag-matrix
      - mock-sandbox-prod-gate
      - build-checks-linux
      - schema-conformance
      - wit-host-drift
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Open or append rolling regression issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          # Find an existing open issue with the nightly-regression label.
          EXISTING=$(gh issue list --label nightly-regression --state open --json number --jq '.[0].number // empty')
          BODY="Nightly Tier 2 cron failed on commit \`$SHA\`.\n\nRun: $RUN_URL\n\nSee failing jobs in the run page; a regression-range report (last green nightly → this commit) will follow."
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            DATE=$(date -u +%Y-%m-%d)
            gh issue create \
              --title "[nightly-CI] regression on $DATE" \
              --label nightly-regression \
              --body "$BODY"
          fi

  regression-range:
    # Runs after nightly-regression-handler on cron failure. Posts the
    # commit range (last green nightly → failing HEAD) to the rolling
    # regression issue so a human can bisect.
    #
    # Automated cross-platform bisect is DEFERRED (was a v0 placeholder that
    # never posted anything). The nightly reds live in platform/config-
    # specific jobs — Windows-only tests, `--locked` msrv, `cargo test -p
    # tau-ir` — that a generic ubuntu `--workspace` nextest bisect cannot
    # reproduce: it marks every commit "good" and posts a wrong culprit or
    # nothing. Until a bisect can run the *offending* job on the *offending*
    # runner, report the range and let a human drive.
    name: regression-range
    needs: nightly-regression-handler
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Find last green nightly SHA
        id: green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Most recent successful nightly cron. No date cap: the old
          # `--created '>=7 days ago'` filter went silent once main had been
          # red for >7 days — exactly when this report is most needed.
          PREV=$(gh run list --workflow=tier2.yml --event=schedule --status success \
            --limit 100 --json headSha,createdAt --jq '.[0] // empty')
          if [ -z "$PREV" ]; then
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "green_date=" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(echo "$PREV" | jq -r '.headSha')" >> "$GITHUB_OUTPUT"
            echo "green_date=$(echo "$PREV" | jq -r '.createdAt')" >> "$GITHUB_OUTPUT"
          fi
      - name: Post regression range to the rolling issue
        # ALWAYS post — the previous version exited silently when no green
        # was found in the window, which is why no culprit ever appeared.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GREEN_SHA: ${{ steps.green.outputs.sha }}
          GREEN_DATE: ${{ steps.green.outputs.green_date }}
          BAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ISSUE=$(gh issue list --label nightly-regression --state open --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            echo "No open nightly-regression issue to comment on; nothing to post."
            exit 0
          fi
          {
            printf 'Regression-range report — automated cross-platform bisect is deferred (see job comment for why).\n\n'
            printf -- '- Failing HEAD: `%s`\n' "$BAD_SHA"
            printf -- '- Run: %s\n' "$RUN_URL"
            if [ -n "$GREEN_SHA" ]; then
              printf -- '- Last green nightly: `%s` (%s)\n' "$GREEN_SHA" "$GREEN_DATE"
              printf -- '- Compare: %s/%s/compare/%s...%s\n\n' "$SERVER_URL" "$REPO" "$GREEN_SHA" "$BAD_SHA"
              printf 'Commits in range (oldest → newest, capped at 50):\n\n'
              git log --reverse --oneline --no-decorate "$GREEN_SHA..$BAD_SHA" 2>/dev/null \
                | head -50 | sed 's/^/    /' \
                || printf '    (unable to compute local range — see the Compare link)\n'
            else
              printf -- '- Last green nightly: none in the last 100 nightly runs. main has been red for an extended period; bisect from a known-good release tag instead.\n'
            fi
          } > "$RUNNER_TEMP/range-comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/range-comment.md"
