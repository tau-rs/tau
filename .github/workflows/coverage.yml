name: Coverage

# Measurement, NOT gating.
#
# This workflow generates LCOV line coverage via `cargo llvm-cov
# nextest` and uploads it to Codecov. It is INFORMATIONAL: it is
# deliberately NOT part of the branch-protection required-check
# surface (that surface is exactly `ci-summary` and nothing else).
# `codecov-action` runs with `fail_ci_if_error: false`, and the job
# is not aggregated into `ci-summary`, so a red coverage run never
# blocks a PR or the merge queue.
#
# Why it triggers on `merge_group` (audit finding G9): the queue
# tests the candidate-merge commit against main. Without a
# `merge_group` trigger, coverage was measured on the PR head but
# never on the actual commit that lands, leaving a gap in the rolling
# coverage trend at exactly the moment code enters main.
#
# Relationship to tier2.yml: tier2 also has a `coverage` job, but it
# only runs on the nightly cron and on `full-matrix`-labeled PRs as
# part of the heavy validation matrix. This standalone workflow is the
# canonical per-event (every PR / push to main / merge-queue) coverage
# signal. A `full-matrix`-labeled PR will therefore run coverage in
# both places; that overlap is harmless because both are
# measurement-only. De-duplicating (dropping coverage from tier2)
# touches tier2.yml and is intentionally left as a follow-up.

on:
  push:
    branches: [main]
  pull_request:
    # Mirror ci.yml: pure-docs changes don't move Rust coverage, so
    # skip them to avoid a pointless ~15-30 min llvm-cov run.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs-*.yml'
  merge_group:
    # Merge-queue runs. The `merge_group` event does not accept a
    # `branches:` filter; the queue only exists for branches that opt
    # in. Measures coverage on the candidate-merge commit (G9).
    types: [checks_requested]

# Cancel superseded runs on the same ref EXCEPT on main (mirrors
# ci.yml — the rust-cache save-step only runs on main and must not be
# interrupted mid-write).
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  coverage:
    name: cargo llvm-cov nextest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          components: llvm-tools-preview
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@492cad282ff2bc751208d9bdcbbcce57c3a90925  # cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov nextest --profile ci --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
