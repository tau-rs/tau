# Tier 3 — scheduled drift (docs/HANDOFF.md §8). Nightly, on main.
#
# Tier 3 jobs open issues instead of failing builds: drift is not the
# committer's fault, and a red build that blames the wrong person trains
# everyone to ignore red. This file holds item 1 of the seven, the
# determinism drift sentinel (#72), item 5, the benchmark regression
# judge (#151), and the keyless live e2e (#168). The rest is tracked in #7.
#
# The sentinel refolds every log in corpus/ with today's main, through
# `tau replay --expect` (#91), and expects the state hash each was pinned at. A hash that moved means the reducer
# changed its mind about an input it had already accepted — ADR-0003's "we
# do not break userspace", checked on a schedule instead of on a user's
# machine. A mismatch files an issue naming the fixture and both hashes. The
# job itself goes red only when it could not have checked the corpus: too
# few fixtures, a missing sidecar, a log the fold refuses, a broken build.
#
# Two landmines from v1 are designed around here. Scheduled workflows get
# throttled: every v1 cron fired every ~11-12h regardless of its expression,
# for months, undetected, so the last step counts this workflow's own
# scheduled firings on the current UTC day and files an issue when the count
# is not exactly one. And an empty lane reports green: scripts/refold-corpus.sh
# fails closed below a fixture-count floor.
#
# The benchmark judge runs kernel/benches/kpi_ir.rs, ADR-0003's two KPIs
# under callgrind, and compares each benchmark's instruction count with the
# baseline committed next to it. Instruction counts do not move with the
# runner's load, which is why they and not wall-clock are the judged number
# (HANDOFF §8 item 5); criterion's `kpi` target stays the informational
# wall-clock reading. More than 5 % over the baseline files an issue per
# benchmark, deduplicated by open title. The job goes red only when it could
# not have judged: valgrind or the runner missing, too few benchmarks, a
# benchmark the baseline does not know. The same two landmines apply: the
# firings counter above covers the whole workflow, all jobs fire together;
# scripts/bench-regression.sh fails closed below a benchmark-count floor.
#
# The keyless live e2e runs `ollama_live` from drivers/tests/e2e_live.rs,
# the tool-loop programs against a real Ollama on the runner over the
# OpenAI-compatible wire: no key, no spend. It is not a provider canary; a
# local model's API does not move (CONTRIBUTING.md, "Provider drift is
# caught by hand"). What it guards is our own driver and tool loop against a
# real server, and the Ollama version pinned here. A failing row files an
# issue naming the row; the job goes red only when it could not have run
# the rows: the install, the pull, the build, or a pass that ran fewer rows
# than ROWS_FLOOR (an empty lane must not read green).

name: tier3

on:
  schedule:
    # 03:17 UTC. An odd minute: the top of the hour is when every scheduled
    # workflow on GitHub wants a runner, and that queue is the throttle.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: >-
          judge: compare kpi_ir instruction counts with the committed baseline (the nightly's
          behaviour). record: measure and upload kernel/benches/kpi_ir.baseline.tsv as the
          `kpi-ir-baseline` artifact for a PR to commit, judge nothing.
        type: choice
        options: [judge, record]
        default: judge
        required: false

permissions:
  contents: read

concurrency:
  group: tier3-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  CORPUS_FLOOR: 10
  KPI_FLOOR: 3
  LIMIT_PCT: 5
  ROWS_FLOOR: 3

jobs:
  sentinel:
    name: determinism drift sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write       # to file drift and firings issues
      actions: read       # to count this workflow's own scheduled runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        # rust-toolchain.toml is the single source of truth for the compiler.
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release -p tau-kernel --bin tau

      - name: Refold the corpus
        id: refold
        run: |
          set -euo pipefail
          SECONDS=0
          ./scripts/refold-corpus.sh | tee refold.txt
          {
            echo "## determinism drift sentinel"
            echo
            echo "- $(rustc --version)"
            echo "- ref: \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`"
            echo "- $(tail -1 refold.txt)"
            echo "- wall: ${SECONDS}s"
            echo
            echo '```'
            grep -E '^(ok|DRIFT|TOOLING) ' refold.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One issue per drifted fixture, deduplicated by exact open title so a
      # drift that persists for a week is one issue, not seven.
      - name: File an issue per drifted fixture
        if: always() && steps.refold.outputs.drifted != '' && steps.refold.outputs.drifted != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --limit 500 --json number,title)"
          while IFS=$'\t' read -r name expected actual; do
            title="tier3: determinism drift — $name"
            existing="$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' <<<"$open" | head -1)"
            if [ -n "$existing" ]; then
              echo "$title: already open as #$existing"
              gh issue comment "$existing" --body "Still drifting on \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`: folded \`$actual\`, sidecar says \`$expected\`. Run: $RUN_URL"
              continue
            fi
            body="$(cat <<EOF
          The nightly sentinel (\`tier3.yml\`) refolded \`corpus/$name.log\` on \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\` and did not get the hash it was pinned at.

          | | state hash |
          |---|---|
          | pinned (\`corpus/$name.hash\`) | \`$expected\` |
          | folded on \`$GITHUB_SHA\` | \`$actual\` |

          - run: $RUN_URL
          - A moved hash is a reducer-behaviour change for an input the reducer had already accepted. Per \`corpus/README.md\`, re-pinning the sidecar is never the fix on its own: it needs an ADR-level reason.

          refs #72, #7
          EOF
          )"
            url="$(gh issue create --title "$title" --label bug --label status:ready --body "$body")"
            echo "$title: opened $url"
          done < drift.tsv

      # The throttle detector. Counts *scheduled* runs of this workflow created
      # on the same UTC calendar day as this one. On a scheduled run the count
      # includes this one, so exactly 1 is healthy: 0 cannot happen, 2+ means
      # the cron is firing more often than its expression. The window is a
      # calendar day and not "the last 24 h" because GitHub's scheduler runs
      # this cron about five hours late with half an hour of jitter either
      # way: a sliding window anchored at this run caught yesterday's run on
      # every night that started earlier in the hour than the night before
      # (#156). The cron is 03:17, so the day boundary sits 20 h away from
      # it; a delay that crosses midnight is worth the report it produces.
      # On a manual run the count is written to the summary and nothing is
      # filed — a dispatch inside the window would otherwise report a false
      # double firing.
      - name: Count this workflow's scheduled firings today (UTC)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          day="$(date -u '+%Y-%m-%d')"
          count="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/tier3.yml/runs" \
            -f event=schedule -f created="$day" -F per_page=100 --jq '.total_count')"
          echo "scheduled firings on $day (UTC): $count (event: $EVENT)"
          {
            echo "- scheduled firings on $day (UTC): $count (this run: \`$EVENT\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" != "schedule" ]; then
            echo "not a scheduled run; count is informational"
            exit 0
          fi
          if [ "$count" -eq 1 ]; then
            exit 0
          fi
          title="tier3: the nightly did not fire exactly once in 24h"
          existing="$(gh issue list --state open --limit 500 --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Again: $count scheduled firing(s) on $day (UTC), counted by $RUN_URL."
            echo "already open as #$existing"
            exit 0
          fi
          body="$(cat <<EOF
          \`tier3.yml\` counted $count scheduled run(s) of itself created on \`$day\` (UTC, this run included). The cron is \`17 3 * * *\`, so the healthy count is exactly 1.

          v1's crons fired every ~11-12h regardless of their expression, for months, undetected. This is the counter that is supposed to notice. Check the run list for the workflow, then decide whether the schedule moved or GitHub's scheduler did.

          - run: $RUN_URL

          refs #72, #7
          EOF
          )"
          url="$(gh issue create --title "$title" --label status:ready --body "$body")"
          echo "opened $url"

  # Item 5: the benchmark regression judge. valgrind and the runner binary
  # are installed here, not on every tier: only this job runs the target.
  # The runner's version must equal the library's, so it is read from
  # Cargo.lock rather than pinned a second time.
  bench:
    name: benchmark regression (instruction counts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write       # to file regression issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install valgrind and the iai-callgrind runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          version="$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "iai-callgrind") | .version')"
          [ -n "$version" ] || { echo "::error::iai-callgrind is not in Cargo.lock"; exit 1; }
          # The runner has no `--version` of its own (it refuses to run
          # outside the library's harness); `cargo install --list` is the
          # record of what is installed.
          installed() { cargo install --list | sed -nE 's/^iai-callgrind-runner v([0-9.]+):$/\1/p'; }
          if [ "$(installed)" != "$version" ]; then
            cargo install --locked iai-callgrind-runner --version "$version"
          fi
          valgrind --version
          echo "iai-callgrind-runner $(installed)"

      - name: Count instructions
        id: bench
        env:
          MODE: ${{ github.event.inputs.baseline || 'judge' }}
        run: |
          set -euo pipefail
          SECONDS=0
          # The runner's JSON goes to stdout, one summary per benchmark;
          # cargo's own chatter and the runner's log go to stderr.
          cargo bench --locked -p tau-kernel --bench kpi_ir -- --output-format=json > ir.json
          ./scripts/bench-regression.sh ir.json | tee judge.txt
          {
            echo "## benchmark regression (instruction counts)"
            echo
            echo "- $(rustc --version); $(valgrind --version); iai-callgrind-runner $(cargo install --list | sed -nE 's/^iai-callgrind-runner v([0-9.]+):$/\1/p')"
            echo "- ref: \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`; mode: \`$MODE\`; limit: +${LIMIT_PCT} %"
            echo "- $(tail -1 judge.txt)"
            echo "- wall (build + run): ${SECONDS}s"
            echo
            echo '```'
            grep -E '^(ok|REGRESSION|FASTER|TOOLING) ' judge.txt || true
            echo '```'
            if [ "$MODE" = "record" ]; then
              echo
              echo "Recorded baseline (\`kpi-ir-baseline\` artifact):"
              echo
              echo '```'
              cat kernel/benches/kpi_ir.baseline.tsv
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the recorded baseline
        if: github.event.inputs.baseline == 'record'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kpi-ir-baseline
          path: kernel/benches/kpi_ir.baseline.tsv
          if-no-files-found: error

      # The callgrind profiles behind the numbers, for whoever reads the
      # issue: `callgrind_annotate` on the `.out` files shows where the
      # instructions went.
      - name: Upload the callgrind profiles
        if: always() && steps.bench.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kpi-ir-profiles
          path: |
            ir.json
            target/iai/
          if-no-files-found: warn
          retention-days: 14

      # One issue per regressed benchmark, deduplicated by exact open title
      # so a regression that persists for a week is one issue, not seven.
      - name: File an issue per regressed benchmark
        if: always() && steps.bench.outputs.regressed != '' && steps.bench.outputs.regressed != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open="$(gh issue list --state open --limit 500 --json number,title)"
          while IFS=$'\t' read -r name old new pct; do
            title="tier3: benchmark regression — $name"
            existing="$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' <<<"$open" | head -1)"
            if [ -n "$existing" ]; then
              echo "$title: already open as #$existing"
              gh issue comment "$existing" --body "Still over the limit on \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`: $new instructions, baseline $old ($pct %). Run: $RUN_URL"
              continue
            fi
            body="$(cat <<EOF
          The nightly judge (\`tier3.yml\`) ran \`kernel/benches/kpi_ir.rs\` on \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\` under callgrind, and \`$name\` retired more than ${LIMIT_PCT} % more instructions than the committed baseline.

          | | instructions (Ir) |
          |---|---|
          | baseline (\`kernel/benches/kpi_ir.baseline.tsv\`) | \`$old\` |
          | measured on \`$GITHUB_SHA\` | \`$new\` ($pct %) |

          - run: $RUN_URL (the \`kpi-ir-profiles\` artifact holds the callgrind profiles; \`callgrind_annotate\` shows where the instructions went)
          - Instruction counts do not move with the runner's load, so this is the code or the toolchain, not the machine. Find the commit between the baseline's \`ref\` (in the file's header) and \`$GITHUB_SHA\` that moved it.
          - If the growth is the price of an intended change, the fix is a re-pin that says so: \`gh workflow run tier3.yml --ref main -f baseline=record\`, then commit the \`kpi-ir-baseline\` artifact in a PR that names the reason.

          refs #151, #7
          EOF
          )"
            url="$(gh issue create --title "$title" --label status:ready --body "$body")"
            echo "$title: opened $url"
          done < regressions.tsv

  # The keyless live e2e (#168): `just live e2e ollama`, on a runner. The
  # release tarball is pinned by version and by the sha256 the release
  # publishes next to it (sha256sum.txt), the same discipline as the action
  # SHAs above; the GPU backends (about 2 GB of CUDA and Vulkan) are not
  # extracted on a CPU runner.
  ollama:
    name: live e2e (ollama, keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write       # to file a drift issue per failing row
    env:
      OLLAMA_VERSION: v0.34.4
      OLLAMA_SHA256: c238986e61d40c0cc5f4a9b9e40b9eea104350b77efa34741fc134e105cb9533
      OLLAMA_MODEL: qwen3:1.7b
      OLLAMA_HOST: 127.0.0.1:11434
      # The rows `common_rows` in drivers/tests/e2e_live.rs runs, in order,
      # so a failure can be named by the row that did not print its line.
      ROWS: tool_result_round_trip parallel_tool_calls_round_trip budget_refusal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Ollama (pinned release, checksum from its sha256sum.txt)
        run: |
          set -euo pipefail
          SECONDS=0
          url="https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          curl -fsSL --retry 3 -o ollama.tar.zst "$url"
          echo "$OLLAMA_SHA256  ollama.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/.local"
          tar --zstd -xf ollama.tar.zst -C "$HOME/.local" \
            --exclude='lib/ollama/cuda_*' --exclude='lib/ollama/vulkan' --exclude='lib/ollama/rocm*'
          rm ollama.tar.zst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ollama" --version
          echo "install=${SECONDS}" >> "$GITHUB_ENV"

      - name: Serve Ollama and pull the model
        run: |
          set -euo pipefail
          SECONDS=0
          nohup ollama serve > ollama-serve.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "http://$OLLAMA_HOST/api/tags" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://$OLLAMA_HOST/api/tags" > /dev/null || {
            echo "::error::ollama did not come up on $OLLAMA_HOST"; cat ollama-serve.log; exit 1; }
          ollama pull "$OLLAMA_MODEL"
          ollama list
          echo "pull=${SECONDS}" >> "$GITHUB_ENV"

      # The exact invocation `just live e2e ollama` uses. The test's own
      # exit status decides between three outcomes: rows ran and passed
      # (ok), a row failed against a live server (drift: file an issue, the
      # job stays green), or the rows could not run at all (tooling: red).
      - name: Run the live rows
        id: rows
        run: |
          set -euo pipefail
          SECONDS=0
          rc=0
          TAU_OLLAMA_LIVE=1 TAU_OLLAMA_BASE_URL="http://$OLLAMA_HOST" \
            cargo test --locked -p tau-drivers --all-features --test e2e_live -- --ignored --nocapture ollama_live \
            2>&1 | tee live.raw || rc=$?
          # CARGO_TERM_COLOR=always wraps cargo's status words in escapes.
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' live.raw > live.txt
          passed="$(sed -nE 's#^live ollama/([A-Za-z0-9_]+) .*#\1#p' live.txt | tr '\n' ' ' | sed 's/ $//')"
          ran="$(sed -nE 's/^live ollama: ([0-9]+) rows.*/\1/p' live.txt | tail -1)"
          {
            echo "## live e2e (ollama, keyless)"
            echo
            echo "- $(rustc --version); $(ollama --version 2>&1 | head -1); model \`$OLLAMA_MODEL\`"
            echo "- ref: \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\`"
            echo "- wall: install ${install}s, pull ${pull}s, rows ${SECONDS}s (build included)"
            echo "- $(grep -E '^live ollama: ' live.txt | tail -1 || echo 'no summary line: the rows did not finish')"
            echo
            echo '```'
            grep -E '^(live ollama/|  parallel:|thread .* panicked|test ollama_live)' live.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            if [ -z "$ran" ] || [ "$ran" -lt "$ROWS_FLOOR" ]; then
              echo "::error::ollama_live passed but ran ${ran:-0} rows; the floor is $ROWS_FLOOR (an empty lane must not read green)"
              exit 1
            fi
            echo "ok: $ran rows"
            exit 0
          fi
          # Tooling, not drift: the test never got to a row.
          if ! grep -q '^running 1 test' live.txt \
             || grep -qE 'TAU_OLLAMA_LIVE is not 1|ollama is not reachable|^error(\[E[0-9]+\])?: ' live.txt; then
            echo "::error::ollama_live could not run its rows (exit $rc); see live.txt"
            exit "$rc"
          fi
          # A row failed. Name it: the first expected row without a passed line.
          failed=""
          for r in $ROWS; do
            case " $passed " in *" $r "*) ;; *) failed="$r"; break ;; esac
          done
          [ -n "$failed" ] || failed="row-$(( $(wc -w <<<"$passed") + 1 ))"
          sed -nE '/^thread .* panicked/,/^(note:|test ollama_live)/p' live.txt | head -40 > panic.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "DRIFT $failed (passed: ${passed:-none})"

      - name: Upload the test output and the server log
        if: always() && steps.rows.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ollama-live
          path: |
            live.txt
            ollama-serve.log
          if-no-files-found: warn
          retention-days: 14

      # One issue per failing row, deduplicated by exact open title so a
      # row that fails for a week is one issue, not seven.
      - name: File an issue for the failing row
        if: always() && steps.rows.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ steps.rows.outputs.failed }}
          PASSED: ${{ steps.rows.outputs.passed }}
        run: |
          set -euo pipefail
          title="tier3: live ollama drift — $FAILED"
          existing="$(gh issue list --state open --limit 500 --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\` (Ollama $OLLAMA_VERSION, \`$OLLAMA_MODEL\`); rows passed before it: ${PASSED:-none}. Run: $RUN_URL"
            echo "$title: already open as #$existing"
            exit 0
          fi
          body="$(cat <<EOF
          The nightly keyless live e2e (\`tier3.yml\`) ran \`ollama_live\` from \`drivers/tests/e2e_live.rs\` on \`$GITHUB_REF_NAME\` @ \`$GITHUB_SHA\` against Ollama $OLLAMA_VERSION serving \`$OLLAMA_MODEL\` on ubuntu-latest, and row \`$FAILED\` failed. Rows that passed before it: ${PASSED:-none}.

          \`\`\`
          $(cat panic.txt)
          \`\`\`

          - run: $RUN_URL (the \`ollama-live\` artifact holds the full test output and the server log)
          - Reproduce: \`just live e2e ollama\` against a local Ollama serving \`$OLLAMA_MODEL\`. A local model's API does not move, so look first at our OpenAI-compatible driver and the tool loop, then at the Ollama version pinned in the workflow; a small model can also just choose differently on one night, so a second night's comment here is the signal, not one.

          refs #168, #7
          EOF
          )"
          url="$(gh issue create --title "$title" --label status:ready --body "$body")"
          echo "$title: opened $url"
