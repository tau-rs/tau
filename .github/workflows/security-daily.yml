name: Security — daily CVE scan

# Daily 04:00 UTC. Runs cargo-audit + osv-scanner against main HEAD.
# Diffs result vs yesterday's cached report. Opens issue
# `[security] new CVE: <id> (<scope>)` (label `security`) on NEW findings only.
#
# Scope is either `workspace` (the root Cargo.lock) or a package slug for one
# of the out-of-workspace Cargo projects — manifests carrying their own
# `[workspace]` table, which the workspace lockfile does not cover. See
# scripts/audit-out-of-workspace.sh and issue #733.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: security-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: cargo audit + osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
        with:
          scan-args: |-
            -r .
        continue-on-error: true
      - name: Save scan results as artifact (for tomorrow's diff)
        run: |
          mkdir -p _security
          # cargo-audit output already surfaced by the action; for diff,
          # re-run cargo audit json to a file. No `|| true` on the install:
          # a failed install would silently produce empty reports for every
          # scope below, and the diff job would go green having seen nothing.
          cargo install cargo-audit --locked --version =0.22.2
          cargo audit --json > _security/cargo-audit.json || true
          # The action above and the command above both read the workspace
          # Cargo.lock only. The out-of-workspace manifests are independent
          # cargo projects whose dependencies appear in no lockfile the
          # workspace owns; audit each one separately (issue #733). The
          # action takes no --file argument, so this is the shelled-out path.
          # Defer a manifest-list drift failure until after the upload so a
          # drifted list never costs a day of advisory coverage.
          scripts/audit-out-of-workspace.sh _security \
            || echo "MANIFEST_DRIFT=1" >> "$GITHUB_ENV"
          ls -1 _security/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: security-daily-${{ github.run_id }}
          path: _security/
          retention-days: 30
      - name: Fail on out-of-workspace manifest drift
        if: env.MANIFEST_DRIFT == '1'
        run: |
          echo "::error::scripts/audit-out-of-workspace.sh no longer finds a manifest listed in its REQUIRED floor — a project moved or was deleted and has silently lost advisory coverage. Update the list."
          exit 1

  diff-and-file-issues:
    name: diff vs yesterday + file issues on new
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download today's report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: security-daily-${{ github.run_id }}
          path: _today/
      - name: Find yesterday's report
        id: yesterday
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the most recent successful run of THIS workflow other
          # than the current run, and download its artifact.
          PREV=$(gh run list --workflow=security-daily.yml --status success \
            --limit 5 --json databaseId --jq ".[] | select(.databaseId != ${{ github.run_id }}) | .databaseId" \
            | head -1)
          if [ -n "$PREV" ]; then
            echo "prev_run=$PREV" >> "$GITHUB_OUTPUT"
          else
            echo "prev_run=" >> "$GITHUB_OUTPUT"
          fi
      - name: Download yesterday's report
        if: steps.yesterday.outputs.prev_run != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          run-id: ${{ steps.yesterday.outputs.prev_run }}
          name: security-daily-${{ steps.yesterday.outputs.prev_run }}
          path: _yesterday/
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Diff + open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          REPORTS=(_today/cargo-audit*.json)
          if [ ${#REPORTS[@]} -eq 0 ]; then
            echo "::error::No cargo-audit report in today's artifact."
            exit 1
          fi
          FILED=0
          for TODAY_FILE in "${REPORTS[@]}"; do
            BASE="$(basename "$TODAY_FILE")"
            YDAY_FILE="_yesterday/$BASE"
            # `cargo-audit.json` is the workspace; `cargo-audit-<pkg>.json`
            # is one out-of-workspace cargo project.
            case "$BASE" in
              cargo-audit.json) SCOPE=workspace ;;
              *) SCOPE="${BASE#cargo-audit-}"; SCOPE="${SCOPE%.json}" ;;
            esac
            # Per-file baseline. A missing counterpart means SKIP, never
            # "everything is new" — otherwise the first run after a new
            # report appears files an issue for every pre-existing advisory
            # in that tree at once.
            if [ ! -f "$YDAY_FILE" ]; then
              echo "No yesterday baseline for $BASE (scope: $SCOPE); skipping (will diff tomorrow)."
              continue
            fi
            # Extract advisory IDs from both reports (jq), diff, file
            # issue for each new ID.
            TODAY_IDS=$(jq -r '.vulnerabilities.list[].advisory.id // empty' "$TODAY_FILE" 2>/dev/null | sort -u)
            YDAY_IDS=$(jq -r '.vulnerabilities.list[].advisory.id // empty' "$YDAY_FILE" 2>/dev/null | sort -u)
            NEW_IDS=$(comm -23 <(echo "$TODAY_IDS") <(echo "$YDAY_IDS"))
            if [ -z "$NEW_IDS" ]; then
              echo "No new advisories vs yesterday for scope: $SCOPE."
              continue
            fi
            while read -r ID; do
              [ -z "$ID" ] && continue
              DETAILS=$(jq -r ".vulnerabilities.list[] | select(.advisory.id == \"$ID\") | .advisory" "$TODAY_FILE")
              # Scope is in the title so the same advisory hitting two
              # cargo projects files two actionable issues, not one.
              gh issue create \
                --title "[security] new CVE: $ID ($SCOPE)" \
                --label security \
                --body "$(printf 'New RustSec advisory detected.\n\nID: %s\nScope: %s (report `%s`)\n\nDetails:\n```json\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n' \
                  "$ID" "$SCOPE" "$BASE" "$DETAILS" \
                  "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
              FILED=$((FILED + 1))
            done <<< "$NEW_IDS"
          done
          echo "Filed $FILED issue(s) across ${#REPORTS[@]} report(s)."
