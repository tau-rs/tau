name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Skip the full Rust matrix on pure-docs PRs. Branch protection
    # should require the ci-summary job (defined at the end of this
    # file), which reports success when all real jobs pass OR when
    # they all skip (the docs-only case). Docs-only PRs still get the
    # docs-check workflow as a gate.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs-*.yml'
  merge_group:
    # Merge-queue runs. Same paths-ignore semantics — the queue tests
    # the candidate merge against main; pure-docs PRs skip the matrix
    # and ci-summary's grace-period logic reports success. The
    # `merge_group` event does not accept a `branches:` filter; the
    # queue itself only exists for branches that opt in.
    types: [checks_requested]
  workflow_call:  # release.yml reuses this workflow for preflight

# Cancel superseded runs on the same ref EXCEPT on main, where the
# Swatinem rust-cache save-step only runs (see
# .github/actions/setup-rust/action.yml `save-if`). Cancelling a
# main run mid-cache-write means the cache write never completes
# and subsequent PRs restore from a stale cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Disable cargo's incremental compilation in CI. CI runs are fresh
  # each time; the Swatinem/rust-cache action restores `target/` and
  # `~/.cargo/{registry,git}` from the most recent main-branch run, so
  # cargo's *between-runs* caching is provided by the action. Disabling
  # incremental within a run makes outputs more deterministic for the
  # cache and avoids the sccache+incremental conflict (incremental
  # compilation embeds compilation-state metadata that sccache can't
  # deduplicate).
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  # Tier 0 — the thin pre-merge gate (trunk-based CI, ADR-0063).
  # Full validation is the nightly tier2.yml run (authority for trunk
  # health, auto-bisect on red). `full-matrix` label pulls tier2 onto
  # a PR on demand; release.yml re-runs both tiers on tags.

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          shared-key: linux-stable
          with-mold: true
          with-just: true
      - run: just fmt

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
          with-just: true
      - run: just lint
      # Lint the guest's cfg(tau_cap_net_http) effect arm (#597). `just lint`
      # above builds tau-wasm-guest against the empty-cap BASELINE world, so the
      # #[cfg(tau_cap_net_http)] `Fetch` arm in dispatcher.rs compiles out and is
      # never linted — the gap that hid a real clippy::redundant_import +
      # clippy::while_let_loop in #585. Feed build.rs a net.http-granting world
      # (byte-pinned to wasm_world_for_project by the
      # `committed_net_http_world_matches_generator` test) so the cfg fires and
      # the arm is compiled + linted under -D warnings. Extends to
      # tau_cap_fs_* once #596 (3.6-b) lands.
      - name: clippy guest cfg(tau_cap_net_http) effect arm (-D warnings)
        env:
          # ABSOLUTE path: build.rs runs with CWD = the crate dir, so a relative
          # TAU_WORLD_WIT would resolve wrong.
          TAU_WORLD_WIT: ${{ github.workspace }}/crates/tau-wasm-guest/wit-cfg/net-http.wit
        run: |
          set -euo pipefail
          # Refuse to run blind: if the world ever stops granting wasi:http,
          # build.rs would leave the cfg off and this job would pass vacuously.
          grep -q 'wasi:http' "$TAU_WORLD_WIT" || {
            echo "::error::$TAU_WORLD_WIT does not grant wasi:http; cfg(tau_cap_net_http) would be off and this lint would be blind (#597)" >&2
            exit 1
          }
          rustup target add wasm32-wasip2
          just lint-wasm-guest-net

  cargo-deny:
    name: cargo-deny / linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe  # v2
        with:
          command: check
          # check advisories + licenses + bans + sources per deny.toml at repo root.
          arguments: --all-features

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        # Scan ONLY the commits this PR/queue-candidate adds on top of main
        # (`HEAD --not origin/main`) — never the whole object store. With
        # `fetch-depth: 0` the runner fetches every remote branch; both
        # `--log-opts "--all"` AND an unscoped `gitleaks detect` (its default
        # walks all reachable refs) then scanned unrelated, unmerged branches'
        # history. A secret in ONE of them failed this job on every
        # push/PR/merge_group and froze the merge queue repo-wide (2026-08-21).
        # main's history is the trusted base (validated by its own runs); this
        # gate checks what the change introduces. On push-to-main the range is
        # empty (HEAD is in origin/main) and the scan is a no-op, which is fine
        # — PRs are the gate. `origin/main` is present thanks to fetch-depth:0.
        run: gitleaks detect --source . --log-opts "HEAD --not origin/main" --no-banner --config .gitleaks.toml

  cargo-check-macos:
    name: cargo-check / macos
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: macos-latest-stable
          with-sccache: true
      - run: cargo check --workspace --all-targets

  cargo-check-windows:
    name: cargo-check / windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: windows-latest-stable
      - run: cargo check --workspace --all-targets

  test-stable:
    name: test-stable / linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # GitHub-hosted ubuntu runners ship python3, so make its absence a hard
    # failure: the tau-sdk-codegen byte-equal Python leg must run here, not
    # self-skip (EPIC 5.3 hardening).
    env:
      TAU_REQUIRE_PYTHON3: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: linux-stable
          with-nextest: true
          with-sccache: true
          with-mold: true
          with-just: true
      - run: just test

  doc-tests:
    name: doc-tests / linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      # Doctests are serial-per-binary in cargo and don't exercise
      # OS-specific paths in this workspace. Linux-only run is enough.
      - run: cargo test --workspace --doc

  rustdoc:
    name: rustdoc / linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      # PR-time guard for broken intra-doc links. 16 crates carry
      # #![deny(rustdoc::broken_intra_doc_links)], so a broken link makes
      # `cargo doc` exit non-zero and fails this job — on the PR that
      # introduced it. Runs the exact command docs-deploy runs, so it fails
      # under the same conditions. Without this, link breakage was caught
      # only inside docs-deploy's build job, which strands the entire mdBook
      # publish (see docs-deploy.yml "Build rustdoc" step).
      - run: cargo doc --no-deps --workspace

  runtime-core-no-std:
    name: runtime-core no-std build + no-forbidden-imports / linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-mold: true
          with-nextest: true
      - name: no-std builds (default and no-default-features)
        run: |
          set -e
          cargo check -p tau-runtime-core
          cargo check -p tau-runtime-core --no-default-features
      - name: runtime-core builds for wasm32-wasip2 (β.7.5 structural no_std guard)
        # Structural guard for the β.7.5 wasm guest: tau-runtime-core (and
        # its pure tau-ir dep) must cross-compile to wasm32-wasip2. A crate
        # boundary (tau-ir / tau-ir-lower) — not a feature flag — keeps the
        # kernel free of tau-pkg → tokio/rustix. See ADR-0051.
        run: |
          set -e
          rustup target add wasm32-wasip2
          cargo build -p tau-runtime-core --target wasm32-wasip2 --no-default-features
      - name: wasm guest links tau-runtime-core std-free (β.7.5 PR-E1 link gate)
        # AUTHORITATIVE std-free LINK gate. Unlike the `cargo build
        # -p tau-runtime-core --target wasm32-wasip2` step above (which only
        # *compiles* the kernel on a target that *has* std), this links the
        # full kernel into the no_std cdylib + encodes the WASI 0.2 component.
        # A `duplicate lang item 'panic_impl'` here means a dependency regained
        # `std` (e.g. a workspace alias lost `default-features = false`, or a
        # crate stopped honouring no_std); `failed to resolve import env::*`
        # means a missing mem-intrinsic. Both are hard regressions of the
        # β.7.5 no_std foundation — do not paper over with --allow-undefined.
        run: cargo build -p tau-wasm-guest --target wasm32-wasip2 --release
      - name: no forbidden executor imports in tau-runtime-core/src
        run: |
          # tau-runtime-core must be executor-agnostic. Top-level (column-0)
          # `use` statements must not import tokio/embassy/smol/async_std/std::*.
          # Imports inside #[cfg(test)] or feature-gated blocks are indented
          # and therefore excluded from the `^use` anchor.
          # std:: items may appear in fully-qualified inline paths (e.g.
          # `std::path::Path`) inside cfg-gated function signatures;
          # this gate only catches module-level `use` statements.
          if grep -rE '^use\s+(tokio|embassy|smol|async_std|std::)' crates/tau-runtime-core/src/; then
            echo "tau-runtime-core source must not import tokio/embassy/smol/async_std/std::* at module level" >&2
            echo "(Use #[cfg(feature = \"..\")] gates if the path genuinely needs std under a feature)" >&2
            exit 1
          fi
      - name: executor-agnostic smoke test
        run: cargo nextest run -p tau-runtime-core --test executor_agnostic_smoke
      - name: run-loop no_std (with tool-validation) — EPIC 0 T9
        # Prove that tool-arg validation RUNS (not just compiles) under the
        # no_std feature set.  The test drives run_ir_streaming with a tool
        # whose input_schema rejects the LLM's first args and asserts
        # ToolCallCompleted { result: Err(_) } appears — proving the
        # #[cfg(feature = "tool-validation")] block in stream.rs fires.
        run: >-
          cargo nextest run -p tau-runtime-core
          --no-default-features
          --features wasm-interpreter,tool-validation,test-fixtures
          --test no_std_validation

  ports-semver:
    name: tau-ports ABI (cargo-semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need origin/main as the semver baseline
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      - name: Install nightly (rustdoc JSON for cargo-semver-checks)
        run: rustup toolchain install nightly --profile minimal
      # Pin cargo-semver-checks >=0.49 so it can parse rustdoc JSON format v60+
      # emitted by current nightly; the old install-action snapshot defaulted to
      # 0.48.0 (v57 max) and failed with "unsupported rustdoc format v60".
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f  # v2.86.4
        with:
          tool: cargo-semver-checks@0.50.0
      - name: tau-ports ABI must not break without a version bump
        run: cargo semver-checks --baseline-rev origin/main --package tau-ports

  mcp-tokio-decoupled:
    name: tau-mcp-tokio stays off the host runtime / linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      - name: manifest must not name tau-runtime-tokio
        # ADR-0062: the MCP transport reaches the process gate as the
        # `tau_ports::DynProcessGate` port; depending on tau-runtime-tokio would
        # drag the whole host runtime (tau-pkg / tau-plugin-protocol / the four
        # sandbox crates) under the transport.
        run: |
          if grep -qE '^[[:space:]]*tau-runtime-tokio[[:space:]]*=' crates/tau-mcp-tokio/Cargo.toml; then
            echo "::error::tau-mcp-tokio/Cargo.toml names tau-runtime-tokio — the MCP transport must stay off the host runtime (ADR-0062)" >&2
            exit 1
          fi
      - name: dependency tree is free of the host runtime + its graph
        run: |
          set -euo pipefail
          tree=$(cargo tree -p tau-mcp-tokio -e normal)
          if echo "$tree" | grep -qE 'tau-runtime-tokio|tau-pkg|tau-plugin-protocol|tau-sandbox'; then
            echo "::error::forbidden crate in tau-mcp-tokio dependency tree (ADR-0062)" >&2
            echo "$tree" | grep -E 'tau-runtime-tokio|tau-pkg|tau-plugin-protocol|tau-sandbox' >&2
            exit 1
          fi
          echo "OK: tau-mcp-tokio depends on none of tau-runtime-tokio / tau-pkg / tau-plugin-protocol / tau-sandbox-*"

  # ci-summary moved to its own workflow (ci-summary.yml) so it
  # can fire on docs-only PRs too (where this workflow's
  # paths-ignore skips it entirely). See that file for the
  # aggregator logic.
