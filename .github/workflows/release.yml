name: Release

# Triggered ONLY on git tag push (v*). This is the ship gate — any
# job failing aborts the GitHub Release creation; the tag stays in
# the repo but no artifacts are published.
#
# This is the canonical T2 HEAVY / release anchor (audit G1). A v*
# tag means "this exact commit passed the full heavy suite", re-run
# against the tagged SHA rather than trusted from a stale main run:
#
#   * preflight-tier1  (ci.yml)    — fmt/clippy/unit/doc/deny/build + feature matrix
#   * preflight-tier2  (tier2.yml) — full OS matrix · conformance · sandbox/runtime e2e · coverage
#   * msrv             (this file) — MSRV re-asserted as a distinct release gate (audit G5)
#   * fuzz             (this file) — cargo-fuzz crash regression on the tagged commit (audit G1)
#   * mutants          (this file) — mutation re-run on the tagged commit (audit G1; non-blocking — see job)
#
# Publication (build-release-binaries → sbom → attest → gh-release-create)
# NEEDS the blocking gates above, so no artifact ships unless they pass.
#
# Coverage is NOT duplicated here — it is owned by the separate
# coverage.yml lane (measurement-not-gating); preflight-tier2 also
# re-runs it against the tag.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: write     # for GitHub Release creation
  id-token: write     # for OIDC signing (attest-build-provenance)
  attestations: write # for attestation upload
  packages: read

jobs:
  preflight-tier1:
    # Re-run Tier 1 against the tag SHA. Even if main was green
    # yesterday, the tag commit may be newer.
    name: preflight-tier1
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  preflight-tier2:
    name: preflight-tier2
    uses: ./.github/workflows/tier2.yml
    secrets: inherit

  msrv:
    # Audit G5: MSRV runs per-PR in ci.yml but is not a distinct
    # release gate. Re-assert it on the tagged commit — the version
    # you ship is the version whose MSRV claim you guarantee. Mirrors
    # ci.yml `msrv-check` (toolchain 1.91, --locked). Blocks the release.
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.91"
          shared-key: linux-1.91
          with-sccache: true
          with-mold: true
      - run: cargo check --workspace --all-targets --locked

  fuzz:
    # Audit G1: cargo-fuzz lives only on a nightly schedule
    # (fuzz-nightly.yml) — it never re-runs against a tagged commit.
    # Re-run each harness here as a bounded crash-regression smoke
    # check: a crash (non-zero exit) is a real correctness bug and
    # BLOCKS the release. Mirrors fuzz-nightly.yml's setup; the matrix
    # stays in sync with it by hand (release.yml-only change per scope).
    name: fuzz ${{ matrix.target }} (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: tau-pkg
            fuzz_dir: crates/tau-pkg/fuzz
            target: lockfile_from_toml_str
          - crate: tau-plugin-protocol
            fuzz_dir: crates/tau-plugin-protocol/fuzz
            target: frame_decode
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Skip if fuzz directory not present
        id: precheck
        env:
          FUZZ_DIR: ${{ matrix.fuzz_dir }}
        run: |
          set -euo pipefail
          if [ ! -f "$FUZZ_DIR/Cargo.toml" ]; then
            echo "fuzz dir $FUZZ_DIR not present — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust nightly + cargo-fuzz
        if: steps.precheck.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly

      - name: Cache cargo-fuzz binary
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-bin-v1

      - name: Install cargo-fuzz (if not cached)
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            cargo +nightly install cargo-fuzz --locked --version =0.13.2
          else
            echo "cargo-fuzz already present"
          fi

      - name: Run fuzz target (release crash-regression budget)
        if: steps.precheck.outputs.skip != 'true'
        env:
          FUZZ_DIR: ${{ matrix.fuzz_dir }}
          TARGET: ${{ matrix.target }}
          # Bounded smoke budget — a release gate exercises the harness
          # against the tagged commit to catch crashes/regressions, it
          # is not an open-ended coverage campaign (that is the nightly
          # lane's job). 5 minutes per target.
          MINUTES: "5"
        run: |
          set -euo pipefail
          SECONDS_BUDGET=$(( MINUTES * 60 ))
          echo "Running $TARGET for ${SECONDS_BUDGET}s..."
          cd "$FUZZ_DIR"
          cargo +nightly fuzz run "$TARGET" -- \
            -max_total_time="$SECONDS_BUDGET" \
            -print_final_stats=1

      - name: Upload crash artifacts on failure
        if: steps.precheck.outputs.skip != 'true' && failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-fuzz-crashes-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ matrix.fuzz_dir }}/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

  mutants:
    # Audit G1: mutation testing lives only on a weekly schedule
    # (mutants-scheduled.yml) — it never re-runs against a tagged
    # commit. Re-run it here so the v* tag carries a fresh mutation
    # report for that exact SHA.
    #
    # NON-BLOCKING by design: cargo-mutants exits non-zero when ANY
    # mutant survives, i.e. it reports a test GAP, not a correctness
    # regression of the tagged commit. Pre-existing surviving mutants
    # are expected (the scheduled lane uploads missed.txt as a normal
    # report), so hard-gating publication on a green mutation score
    # would make releases un-cuttable. This is the same measurement-
    # not-gating stance the audit takes for coverage (G9). The report
    # is uploaded; publication does NOT depend on this job.
    name: mutants (${{ matrix.crate }})
    needs: [preflight-tier1]  # don't burn hours of mutation if basic CI is red
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        crate:
          - tau-domain
          - tau-pkg
          - tau-ports
          - tau-runtime-core
          - tau-runtime-tokio
          - tau-plugin-protocol
          - tau-cli
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: linux-stable
          save-if: "false"
      - uses: taiki-e/install-action@fa8484446eeba15720aa701ffc5dcb6dfa092ff1  # nextest
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version =27.1.0
      - name: Run mutation testing
        env:
          CRATE: ${{ matrix.crate }}
        run: |
          set -euo pipefail
          cargo mutants \
            --in-place \
            -p "$CRATE" \
            --timeout 300 \
            --no-shuffle
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-mutants-${{ matrix.crate }}-${{ github.run_id }}
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 90

  build-release-binaries:
    name: build-release-binaries / ${{ matrix.os }}
    needs: [preflight-tier1, preflight-tier2, msrv, fuzz]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable
          shared-key: ${{ matrix.os }}-stable-release
          with-sccache: true
          with-mold: true
      - name: Build tau-cli (release)
        run: cargo build --release -p tau-cli --bin tau
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p _release
          # cargo emits tau OR tau.exe depending on OS
          if [ -f target/release/tau.exe ]; then
            cp target/release/tau.exe "_release/tau-${{ matrix.os }}.exe"
          else
            cp target/release/tau "_release/tau-${{ matrix.os }}"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-bin-${{ matrix.os }}
          path: _release/
          retention-days: 7

  sbom-rust:
    name: sbom-rust (SPDX 2.3)
    needs: [preflight-tier1, preflight-tier2, msrv, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-stable
          with-sccache: true
          with-mold: true
      - name: Install cargo-sbom
        run: cargo install cargo-sbom --locked --version =0.10.0
      - name: Generate SPDX 2.3 SBOM
        run: cargo sbom --output-format spdx_json_2_3 > tau-sbom-rust.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-rust
          path: tau-sbom-rust.spdx.json
          retention-days: 7

  sbom-aggregate:
    name: sbom-aggregate (syft)
    needs: [preflight-tier1, preflight-tier2, msrv, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Generate aggregate SBOM via syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          path: .
          format: spdx-json
          output-file: tau-sbom-aggregate.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: sbom-aggregate
          path: tau-sbom-aggregate.spdx.json
          retention-days: 7

  attest:
    name: attest provenance + sbom
    needs: [build-release-binaries, sbom-rust, sbom-aggregate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-bin-*
          path: _release/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sbom-*
          path: _sbom/
          merge-multiple: true
      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: '_release/*'
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34  # v3
        with:
          subject-path: '_release/*'
          sbom-path: '_sbom/tau-sbom-rust.spdx.json'

  changelog:
    name: changelog
    needs: [preflight-tier1, preflight-tier2, msrv, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
      - id: cliff
        uses: orhun/git-cliff-action@b946ed27a675d653b308f29a7bbad813b85bf7aa  # v3
        with:
          config: .github/cliff.toml
          args: --latest --strip header

  gh-release-create:
    name: gh-release-create
    needs: [build-release-binaries, sbom-rust, sbom-aggregate, attest, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: release-bin-*
          path: _release/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sbom-*
          path: _sbom/
          merge-multiple: true
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          tag_name: ${{ needs.build-release-binaries.outputs.tag }}
          body: ${{ needs.changelog.outputs.body }}
          files: |
            _release/*
            _sbom/*
          fail_on_unmatched_files: true
