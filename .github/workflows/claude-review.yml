name: Claude review

# AI code review via anthropics/claude-code-action.
#
# Two trigger modes, each routed to the action with a different
# `prompt`:
#
#   1. Opt-in PR review — adding the `claude:review` label to a PR
#      runs a Claude review. To re-review after edits, remove and
#      re-add the label (only the `labeled` action fires the job):
#
#          gh pr edit <N> --remove-label claude:review
#          gh pr edit <N> --add-label claude:review
#
#      Auto-review on every PR open/push was removed on 2026-08-22.
#      Two reasons: (a) it was never a required check, and most PRs
#      here are already self-reviewed by an agent session, so the
#      marginal value per run was low; (b) it had silently been a
#      no-op for months — the pinned action moved to the v1 input
#      schema, which dropped `direct_prompt`/`model`, so every run
#      ignored those inputs ("Unexpected input(s)"), found no
#      trigger, skipped, and reported success while still burning a
#      runner + full-history checkout per push.
#
#   2. Release-summary — when a GitHub release is published, Claude
#      reads the diff from the previous major-equivalent tag (QG11:
#      `v[0-9]+.0.0` / `v0.[0-9]+.0`) and opens a release-summary
#      issue with changelog highlights + notable risks. The release
#      event cannot run the action directly (see the
#      `dispatch-release-summary` job), so it re-fires this workflow as
#      a workflow_dispatch. To (re)run a summary by hand for any tag:
#
#          gh workflow run claude-review.yml -f tag=v0.3.0
#
# Distinct from `.github/workflows/claude.yml` (the @claude mention
# bot): that one is interactive (responds to maintainer @-mentions);
# this one is non-interactive (event-driven analysis output).
#
# Secret
# ------
# Shared with claude.yml: `CLAUDE_CODE_OAUTH_TOKEN` (Claude.ai
# subscription via OAuth). Set via Settings → Secrets and variables
# → Actions. Generate locally with `claude setup-token`.
#
# Security
# --------
# `pull_request` (not `pull_request_target`) is used so fork PRs
# cannot access the OAuth secret. Labels can only be added by users
# with triage+ permission, so the label trigger is maintainer-gated
# by construction. Release-summary only fires on `release: published`
# (requires write access).

on:
  pull_request:
    types: [labeled]
  # release: triggered when a GitHub release is published (via UI or
  # API) for a tag. We previously used `push: tags:` here but that
  # event shape produces an OIDC token the Claude Code GitHub App
  # rejects ("Invalid OIDC token"). `release` events have the correct
  # OIDC claims. Trade-off: pushing a bare tag no longer fires the
  # release-summary; you must also publish a GitHub Release for that
  # tag. docs-deploy.yml continues to fire on raw `push: tags:` so the
  # site itself is published on any matching tag push.
  #
  # The release event does NOT run the Claude action directly — see the
  # `dispatch-release-summary` job for why it re-fires as a
  # workflow_dispatch.
  release:
    types: [published]
  # Manual/bridged entry point for the release summary. Also useful on
  # its own: re-run a summary for any tag without republishing a
  # release (this is how the job is smoke-tested).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to summarize (e.g. v0.3.0)"
        required: true
        type: string

concurrency:
  group: claude-review-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review-pr:
    name: review PR
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'claude:review'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7  # v1.0.206
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pass the workflow's auto-injected GITHUB_TOKEN so the action's
          # GitHub REST calls (permission check on the PR actor, comment
          # posting) authenticate against the current repo. Without this
          # the action exchanges the OAuth token for a GitHub App
          # installation token scoped to the App's installed owner — that
          # breaks on repo transfer (tau: LEBOCQTitouan → tau-rs on
          # 2026-06-10 surfaced this). GITHUB_TOKEN is always scoped to
          # the current repo, so it survives transfers.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The labeled PR may belong to a Bot actor (e.g. dependabot);
          # without this the action aborts with "Workflow initiated by
          # non-human actor: dependabot".
          allowed_bots: "dependabot"
          # One review comment per PR, updated in place on re-review,
          # instead of a new comment per labeled run.
          use_sticky_comment: true
          # Force tag mode for this labeled-PR event. Without it the
          # action runs in bare agent mode, where the GitHub comment
          # tools are not allowlisted — verified on PR #632: Claude
          # completed the review (32 turns) but hit 13 permission
          # denials trying to post it, and the run went green with no
          # comment. Tag mode wires up PR context + the comment tool.
          track_progress: true
          # Pin the model via claude_args (the v1 action has no `model`
          # input). Pinning survives the action's default-model churn —
          # the old pinned default was retired and 404'd every run.
          # Bump when the model line moves.
          claude_args: "--model claude-sonnet-5"
          prompt: |
            Review this pull request as a senior engineer would.
            Focus on:
              - Correctness bugs, edge cases the tests miss
              - Security issues (input validation, auth, injection)
              - Performance regressions
              - API/contract changes that affect callers
              - Code style only when it actively harms readability
            Skip nits about formatting (rustfmt enforces that) or
            clippy-caught issues (the clippy job covers those).
            Be concise. If the PR is in great shape, say so plainly
            instead of inventing nits.
            Post the full review in your PR comment.

  # anthropics/claude-code-action does not understand `release` events:
  # its context parser (src/github/context.ts) switches over a fixed set
  # — issues, issue_comment, pull_request{,_target,_review,_review_comment},
  # workflow_dispatch, repository_dispatch, schedule, workflow_run — and
  # throws "Unsupported event type: release" on anything else. Verified
  # against the pinned SHA and against the action's main branch on
  # 2026-08-23; the release-summary job had never actually run.
  #
  # So the release event only re-fires this same workflow as a
  # workflow_dispatch, which the action does support. workflow_dispatch
  # is one of the two documented exceptions to "events triggered by
  # GITHUB_TOKEN do not create a new workflow run" (the other being
  # repository_dispatch), so the default token is enough — no PAT.
  dispatch-release-summary:
    name: dispatch release summary
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Re-fire as workflow_dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          # workflow_dispatch can only target a branch, and the workflow
          # file is read from that branch — the released code itself is
          # checked out by the summary job via `ref:`.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run claude-review.yml --ref "$DEFAULT_BRANCH" -f tag="$TAG"
          echo "Dispatched release summary for $TAG on $DEFAULT_BRANCH"

  release-summary:
    name: release summary
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # workflow_dispatch inputs require write access to set, so this
          # is maintainer-controlled; the step below fails fast if the
          # tag does not resolve.
          ref: ${{ inputs.tag }}

      - name: Resolve previous tag
        id: prev
        env:
          CURRENT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${CURRENT_TAG}" >/dev/null; then
            echo "::error::No such tag: ${CURRENT_TAG}"
            exit 1
          fi
          # grep exits 1 when CURRENT_TAG isn't in the QG11 tag list
          # (first-ever release, or a non-QG11 tag) — under pipefail
          # that would kill the step inside the assignment before the
          # empty-string fallback below can run. Mask the pipeline
          # status so the fallback handles it.
          previous=$(git tag --list 'v*.0.0' 'v0.*.0' --sort=-v:refname \
            | grep -A1 "^${CURRENT_TAG}$" | tail -n1 || true)
          if [[ -z "$previous" || "$previous" == "$CURRENT_TAG" ]]; then
            previous=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous tag/commit: $previous"

      - uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7  # v1.0.206
        # `workflow_dispatch` events run in bare agent mode (track_progress
        # only applies to PR/issue events), where no tools are allowlisted
        # by default — grant exactly what the task needs via --allowedTools
        # and give the Bash tool a GH_TOKEN so `gh issue create` works
        # (the job's `issues: write` permission scopes what it can do).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # When the release event dispatches this run, the actor is
          # github-actions[bot], and agent mode rejects non-human actors
          # unless they are allow-listed. Ignored when a human dispatches
          # manually (the check only consults allowed_bots for non-User
          # accounts).
          allowed_bots: "github-actions"
          # See note above on the PR-review job — same reason: survive
          # repo transfers by using the workflow-scoped GITHUB_TOKEN
          # instead of the GitHub App installation token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # See the model-pin note on the PR-review job.
          #
          # The tool list below is evidence-driven, not guessed (#645).
          # The first green run burned 11 of 18 turns on denied calls;
          # a repeat run instrumented to dump the SDK's
          # `permission_denials` records (8 denials / 22 turns) showed
          # exactly three causes, all addressed here:
          #
          #   1. `git fetch --all --tags` — denied 3x (twice as a bare
          #      retry). The grant below stops the retry loop, and the
          #      prompt now states the checkout is already complete so
          #      the call should not be attempted at all.
          #   2. `Write` — denied 2x. The model needs to stage a long
          #      markdown body somewhere before creating the issue;
          #      with no writable tool it fell back to a `cat <<EOF`
          #      heredoc, which was denied too. `Write` plus
          #      `gh issue create --body-file` is the clean path.
          #   3. Text-processing utilities inside pipelines. Claude
          #      Code authorizes each pipeline segment independently,
          #      so `git log --oneline | head -100` needs `head` as
          #      well as `git log`. The utilities below are the ones
          #      the denial records actually named.
          #
          # Everything added is read-only or writes only to the
          # ephemeral runner filesystem. Notably NOT widened: `gh`
          # stays pinned to `gh issue create`, so the job's one
          # outward-facing capability is unchanged.
          #
          # One class of denial is deliberately absent from this list
          # because it cannot be expressed here (#707). Shell output
          # redirection defeats a prefix grant: `Bash(git log:*)` does
          # NOT authorise `git log --pretty=... <range> > /tmp/f.txt`,
          # measured as an isolated denial with no pipe and no `&&`.
          # `>` is a shell construct, not a command prefix, so there is
          # no rule to add — the fix is in the prompt, which steers file
          # creation to the Write tool granted above.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Write,Bash(git diff:*),Bash(git log:*),Bash(git tag:*),Bash(git rev-list:*),Bash(git fetch:*),Bash(cat:*),Bash(echo:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sed:*),Bash(awk:*),Bash(sort:*),Bash(uniq:*),Bash(grep:*),Bash(gh issue create:*)"
          # Both interpolated values are maintainer-controlled (the tag
          # comes from a workflow_dispatch input, which requires write
          # access to set, and is verified to resolve above; the previous
          # tag/SHA is resolved by the previous step) — not arbitrary
          # user input.
          prompt: |
            A new GitHub release was published: ${{ inputs.tag }}.
            Read the diff between ${{ steps.prev.outputs.previous }} and
            ${{ inputs.tag }} and open a GitHub issue
            titled "Release summary: ${{ inputs.tag }}"
            containing:
              - Changelog-style highlights of what shipped
                (grouped: features / fixes / breaking changes /
                docs / CI)
              - Notable risks or behaviors a user upgrading to this
                version should know about
              - Recommended manual smoke tests before publishing
                release notes
            Start with `git log --oneline` and `git diff --stat` over the
            range and only read full diffs for what looks significant —
            when there is no previous tag the range starts at the root
            commit, so the raw diff is the whole repository.
            The checkout is already a full clone with all tags fetched,
            so both refs resolve locally — do not run `git fetch`.
            Create files only with the Write tool, and only at paths
            directly under the workspace root or /tmp. Shell file-I/O is
            refused and will cost you a turn: do not use output
            redirection (`>` / `>>`), heredocs (`cat <<EOF`), `mkdir`,
            or `rm`. To collect command output, read the tool result
            directly rather than redirecting it to a file. The runner is
            ephemeral, so do not clean anything up afterwards.
            Stage the issue body with Write, then open the issue with
            `gh issue create --body-file <path>`; the body is long
            enough that passing it inline with `--body` is unreliable.
            Be concise; this is a record, not a full audit.
