# Dependabot: one reviewable PR per bump, through Tier 1 and the merge queue like
# any other change (issue #157).
#
# Three surfaces, because there are three places a version is pinned: the
# workspace lockfile, fuzz/'s own lockfile (not a workspace member on purpose),
# and the commit SHAs the workflows pin their actions to.
#
# Weekly and grouped so that volume stays compatible with the merge queue: one
# PR per surface per week, majors on their own since they can change behaviour.
#
# `cooldown` holds back a freshly published version. A malicious release is
# usually yanked within days; waiting a week is the cheapest defence there is.
# Security updates ignore both the schedule and the cooldown.
#
# Prefixes are conventional-commit because squash merge takes the PR title.
# rust-toolchain.toml is not covered: Dependabot has no ecosystem for it.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      fuzz:
        patterns: ["*"]
    commit-message:
      prefix: "build(fuzz-deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
