[package]
name = "tau-wasm-fs-probe"
version = "0.0.0"
edition = "2021"
publish = false
# Intentionally NOT a workspace member: a std wasm32-wasip2 component built on
# demand by the enforcement test. Empty [workspace] makes cargo treat this as
# its own root so it doesn't attach to the outer workspace.

[lib]
crate-type = ["cdylib"]

[dependencies]
# Must equal the workspace pin in the root `Cargo.toml` — this manifest is its
# own cargo root (see `[workspace]` below), so `workspace = true` cannot resolve
# and dependabot cannot see it. CI's `wasm probe fixtures track the workspace
# wit-bindgen` job enforces the equality (issue #722).
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc"] }

[workspace]
