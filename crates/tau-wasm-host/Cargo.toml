[package]
name = "tau-wasm-host"
description = "β.7.5 wasm host: a std wasmtime embedder for the tau-wasm-guest WASI 0.2 component. Products supply the four tau:host/runner imports via the EmbedPorts trait (EPIC 7.2); the deterministic conformance entrypoints run the same machinery with canned ports. Host-only (std + wasmtime); never built for wasm32."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
wasmtime           = { workspace = true }
wasmtime-wasi      = "48"
wasmtime-wasi-http = "48"
# Needed to name the `http::Request<WasiBody>` type in the
# `WasiHttpHooks::send_request` override signature (EPIC 3.3), and to box the
# permitted response body back into `WasiBody` (an `UnsyncBoxBody`) — which is
# what wasmtime-wasi-http 48's hook returns. Replaces the `hyper` dep: 48's
# hook signature is stated in `http`/`http-body` types, not hyper ones.
http               = "1"
http-body-util     = "0.1"
tau-ports     = { workspace = true, features = ["serde"] }
tau-domain    = { workspace = true }
serde_json    = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }

[dev-dependencies]
tau-ir           = { workspace = true }
tau-ir-lower     = { workspace = true }
tau-pkg          = { workspace = true }
tau-runtime-core = { workspace = true, features = ["std"] }
tau-domain       = { workspace = true, features = ["test-fixtures"] }
tempfile         = { workspace = true }
wit-parser       = { workspace = true }

[lints]
workspace = true
