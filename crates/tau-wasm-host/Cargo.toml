[package]
name = "tau-wasm-host"
description = "β.7.5 wasm host: a std wasmtime embedder that loads the tau-wasm-guest WASI 0.2 component, satisfies the three tau:run/host imports with deterministic stubs, applies a determinism Config, and drives the guest's exported `run`. Host-only (std + wasmtime); never built for wasm32."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
wasmtime   = { workspace = true }
tau-ports  = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
