[package]
name = "tau-workflow"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
integration-tests = []

[dependencies]
tau-domain  = { workspace = true }
tau-observe = { workspace = true }
tau-runtime = { workspace = true }
tau-ports   = { workspace = true }
tau-pkg     = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
toml        = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true, features = ["fs", "io-util", "time", "macros", "rt"] }
chrono      = { workspace = true, features = ["serde"] }
ulid        = "1"

[dev-dependencies]
tempfile    = { workspace = true }
tokio       = { workspace = true, features = ["fs", "io-util", "time", "macros", "rt", "test-util"] }
tokio-test  = "0.4"
tau-domain  = { workspace = true, features = ["test-fixtures"] }
tau-ports   = { workspace = true, features = ["test-fixtures"] }
# Persistence unit tests install `WorkflowRunLogLayer` as the
# thread-local subscriber so `RunLog::append` (a `tracing::event!`
# emitter post-Sub-project-D Task 3) actually materializes JSONL lines.
tracing-subscriber = { workspace = true, features = ["registry"] }
