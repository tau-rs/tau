[package]
name = "tau-observe"
description = "Observability primitives for tau (structured logging, tracing)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
chrono             = { workspace = true }
serde_json         = { workspace = true }
tau-domain         = { workspace = true }
tokio              = { workspace = true, features = ["fs", "sync"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "json", "registry"] }
tracing-appender   = { version = "0.2", optional = true }
thiserror          = { workspace = true }

# Optional OpenTelemetry stack — enabled by the `otlp` feature. The
# version family is anchored by `tracing-opentelemetry 0.22`, which
# targets `opentelemetry 0.21` / `opentelemetry_sdk 0.21` /
# `opentelemetry-otlp 0.14`.
opentelemetry         = { version = "0.21", optional = true }
opentelemetry_sdk     = { version = "0.21", features = ["rt-tokio"], optional = true }
opentelemetry-otlp    = { version = "0.14", features = ["grpc-tonic"], optional = true }
tracing-opentelemetry = { version = "0.22", optional = true }
# `tonic` is a transitive dep of `opentelemetry-otlp`; declared explicitly
# here so `tonic::metadata::MetadataMap` is reachable from this crate.
tonic                 = { version = "0.9", default-features = false, optional = true }

[dev-dependencies]
# Offline OTLP exporter used by feature-gated smoke tests; matches the
# `opentelemetry 0.21` family above.
opentelemetry-stdout = { version = "0.2", features = ["trace"] }
tempfile             = { workspace = true }
# `tokio::test` + the polling helper in `tests/layer_format_compat.rs`
# need the macros + multi-thread runtime + time features. The
# production-side `tokio` line above sticks to `["fs", "sync"]`; Cargo
# unions the feature sets in tests.
tokio                = { workspace = true, features = ["fs", "sync", "macros", "rt", "rt-multi-thread", "time"] }
# Byte-identical output assertions in `tests/layer_format_compat.rs`
# construct a `StepRecord` and round-trip the layer's JSONL through
# serde. Dev-dep cycle (tau-workflow already depends on tau-observe)
# is allowed by Cargo for `[dev-dependencies]`.
tau-workflow         = { workspace = true }

[features]
default = []
# Enables the `tau_observe::capture` test-only subscriber. Consumers
# typically add this under `[dev-dependencies]` of crates whose tests
# assert on emitted spans/events.
test-fixtures = []
# Enables the non-blocking MPSC writer + log rotation via tracing-appender.
non_blocking = ["dep:tracing-appender"]
# Enables the optional OpenTelemetry/OTLP exporter wiring. Off by
# default — opted into by the CLI when `--otlp-endpoint` or
# `OTEL_EXPORTER_OTLP_ENDPOINT` is set.
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tonic",
]
