[package]
name = "tau-native-tools"
description = "β.7.5 shared deterministic native tools (read_temp/set_fan), no_std; one source of tool bodies for both the dev conformance profile and the wasm guest."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
# The feature list is a CROSS-TARGET PARITY contract, not a size knob
# (ADR-0068, #621). This crate is the single source of the `matches` goal
# predicate for both the native registry and the wasm guest, but the engine's
# accepted language is decided by cargo feature unification: in the `tau-cli`
# graph `jsonschema → fancy-regex` (and `regex`) pull `regex-automata` up to
# the full Unicode set, while the guest links only what is declared HERE.
# Anything enabled there and missing here compiles natively and fails to
# compile in-guest — a silent wrong-branch on wasm only. So this list must
# stay a superset of what the native graph accepts: `unicode` (age, bool,
# case, gencat, perl, script, segment) plus `unicode-word-boundary` for `\b`.
# `goal_predicates::matches_parses_the_same_language_the_native_graph_does`
# fails if this is trimmed. Never enable "std".
regex-automata = { workspace = true, optional = true, features = ["alloc", "meta", "syntax", "nfa-pikevm", "unicode", "unicode-word-boundary"] }

[features]
goal-predicates = ["dep:regex-automata"]

[lints]
workspace = true
