[project]
name = "research"

[agents.gather]
display_name = "Gather"
package      = "research@^0.1"
llm_backend  = "mock-llm"
model        = "mock-1"
max_turns    = 1

[agents.gather.prompt]
system = "Research the question; collect sources."

[agents.writer]
display_name = "Writer"
package      = "research@^0.1"
llm_backend  = "mock-llm"
model        = "mock-1"
max_turns    = 1
tool_refs    = ["write_file"]
produces     = ["/workspace/report.md"]

[agents.writer.prompt]
system = "Write /workspace/report.md from the notes."

[tools.write_file]
native       = "WriteFile"
description  = "Write a file"
capabilities = [{ kind = "fs.write", paths = ["/workspace/**"] }]

[goals.has_sources]
evaluates = "/workspace/report.md"
check     = "matches"
pattern   = "(?m)^## Sources"

[deliverables.report]
path         = "/workspace/report.md"
must_satisfy = "A coherent summary that accurately reflects the sources."
on_fail      = "retry"
max_attempts = 3
retry_from   = "writer"

[[pipeline.steps]]
id    = "gather"
run   = "agent:gather"
input = "${input}"

[[pipeline.steps]]
id    = "writer"
run   = "agent:writer"
input = "${steps.gather.output}"

[[pipeline.steps]]
id    = "verify_report"
run   = "check:report"
input = "${steps.writer.output}"

[[pipeline.steps]]
id    = "verify_sources"
run   = "check:has_sources"
input = "${steps.writer.output}"
