[package]
name = "tau-sandbox-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Windows AppContainer sandbox adapter for tau"

[dependencies]
tau-domain          = { workspace = true, features = ["serde"] }
tau-ports           = { workspace = true, features = ["serde", "process"] }
tau-sandbox-proxy   = { workspace = true }
serde               = { workspace = true, features = ["std"] }
tracing             = { workspace = true }
tokio               = { workspace = true }
thiserror           = { workspace = true }

[[bin]]
name = "tau-appcontainer-launcher"
path = "src/bin/tau-appcontainer-launcher.rs"

# Real Win32 AppContainer + ACL + process-creation calls. Target-gated so
# the crate still builds on Linux/macOS (pure-logic modules only).
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
]

[dev-dependencies]
serde_json = "1"
tau-domain = { workspace = true, features = ["serde"] }
tau-ports  = { workspace = true, features = ["serde"] }
tempfile   = "3"

[features]
default = []
integration-tests = []

[lints]
workspace = true
