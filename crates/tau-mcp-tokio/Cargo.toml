[package]
name = "tau-mcp-tokio"
description = "Tokio runtime + transports for tau-mcp. stdio (subprocess) and Streamable HTTP transports; host-lifecycle (handshake, keepalive, shutdown); McpBridge composable ToolDispatcher adapter. Scaffold only in PR-1; transports land in PR-2 and PR-3."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
tau-mcp           = { workspace = true, features = ["with-std-adapters"] }
tau-domain        = { workspace = true, features = ["serde"] }
# Process-spawn gating goes through the `tau_ports::DynProcessGate` port
# (ADR-0060) — the host injects the concrete gate. `process` brings the port
# trait + `PassthroughGate`. tau-mcp-tokio deliberately does NOT depend on
# tau-runtime-tokio, so the MCP transport stays off the host runtime's
# tau-pkg / plugin-protocol / sandbox graph.
tau-ports         = { workspace = true, features = ["serde", "process"] }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
# `std` for thiserror's `AsDisplay<PathBuf>` in host_lifecycle::error (formats a
# cassette path). Previously unified in via tau-runtime-tokio's dep graph;
# explicit now that the transport no longer depends on the host runtime.
thiserror         = { workspace = true, features = ["std"] }
tokio             = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "process",
    "time",
    "sync",
] }
tracing           = { workspace = true }
# HTTP transport (PR-3).
reqwest           = { workspace = true }
bytes             = { workspace = true }
futures           = { workspace = true }
url               = { workspace = true }

# INVARIANT: tau-mcp-tokio must NOT depend on tau-runtime-tokio (or tau-pkg,
# tau-plugin-protocol, or any tau-sandbox-* crate). The process gate reaches it
# as the `tau_ports::DynProcessGate` port, injected by the host. A CI guard
# (mcp-tokio-decoupled) asserts this manifest never names tau-runtime-tokio.
[dev-dependencies]
tokio    = { workspace = true, features = ["test-util", "fs"] }
tempfile = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
