[package]
name = "tau-mcp-tokio"
description = "Tokio runtime + transports for tau-mcp. stdio (subprocess) and Streamable HTTP transports; host-lifecycle (handshake, keepalive, shutdown); McpBridge composable ToolDispatcher adapter. Scaffold only in PR-1; transports land in PR-2 and PR-3."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
tau-mcp           = { workspace = true }
tau-domain        = { workspace = true, features = ["serde"] }
tau-ports         = { workspace = true, features = ["serde"] }
# Sandbox integration: tau-runtime-tokio::process_gate::wrap_spawn (PR-2).
# HTTP transport (PR-3) doesn't need this; the dep is stdio-driven for now.
tau-runtime-tokio = { workspace = true }
serde             = { workspace = true, features = ["derive"] }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "process",
    "time",
] }
tracing           = { workspace = true }

# NOTE: do NOT enable tau-runtime-tokio's "test-support" feature here.
# PassthroughSandbox (the only test-support thing our fixture-driven
# integration tests touch) is unconditionally public; activating
# "test-support" unifies feature flags workspace-wide and exposes
# tau-runtime-tokio's own `plugin_host_ipc_llm.rs` test, which has
# been broken on main since β.1.5 added a SessionContext arg to
# DynTool::invoke. Fixing that test is out of PR-2's scope; not
# activating the feature keeps the test dormant the same way every
# other PR (incl. PR #280) did.
[dev-dependencies]
tokio    = { workspace = true, features = ["test-util", "fs"] }
tempfile = { workspace = true }
