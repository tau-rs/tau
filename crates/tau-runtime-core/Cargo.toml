[package]
name = "tau-runtime-core"
description = "Executor-agnostic kernel of tau. no_std + alloc. Host shells (tau-runtime-tokio, tau-runtime-embassy) drive this on their executor."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
tau-domain   = { workspace = true, default-features = false, features = ["serde"] }
tau-ports    = { workspace = true, default-features = false, features = ["serde"] }
tau-ir       = { workspace = true }
thiserror    = { workspace = true, default-features = false }
serde        = { workspace = true, default-features = false, features = ["alloc", "derive"] }
serde_json   = { workspace = true }
chrono       = { workspace = true, default-features = false, features = ["alloc", "serde"] }
# `FloatCore` (no_std float round/fract/abs/max) for the schema validator's
# numeric checks — std's inherent f64 methods are absent on no_std targets
# (wasm32-wasip2). default-features=false keeps it no_std (FloatCore needs no libm).
num-traits   = { version = "0.2", default-features = false }
hashbrown    = { workspace = true }
foldhash     = { workspace = true }
# `v4` for session-id minting in `ids::uuid_v4` — distinct from the `v7`
# feature in the workspace alias (used by id newtypes in tau-domain).
uuid         = { workspace = true, features = ["v4"] }
# ULID generation for run-ids and trace-event-ids via `ids::ulid`.
ulid         = { workspace = true, default-features = false }
futures-core = { workspace = true, default-features = false, features = ["alloc"] }
futures-util = { workspace = true, default-features = false, features = ["alloc"] }
tracing      = { workspace = true, default-features = false, features = ["attributes"] }
# Required by `stream::run_streaming_inner` (the async_stream::stream! macro).
async-stream = { workspace = true }
# Glob matching for skill_resolve::apply_scope_paths (skill capability
# narrowing). std-only (aho-corasick/regex) → optional, gated behind
# `host-fs` (the feature its only caller `resolve_skill_for_spawn` needs).
globset      = { workspace = true, optional = true }
schemars     = { workspace = true, optional = true, features = ["derive"] }
[features]
# `process` makes ProcessCapabilityGate wire-up available; pulled in via
# tau-ports' `process` feature. Host shells (tau-runtime-tokio) keep this on.
process            = ["tau-ports/process"]
# `capability-override` enables override-aware capability resolution wiring.
capability-override = []
# `wasm-interpreter` exposes `interpreter` and `stream` without std (no
# `AgentInstanceId::new`/`Message::new`). Used by the no_std wasm guest to
# drive `run_ir_streaming` and serialize `RunEvent`. All
# `Message::new`/`AgentInstanceId::new` calls in these modules are replaced by
# no_std-safe `ids::message_id`/`ids::agent_instance_id` helpers.
wasm-interpreter   = []
# `tool-validation` enables ADR-0010 no_std tool args validation (EPIC 0).
# Implies `wasm-interpreter` (stream + interpreter are a superset already;
# gating them behind tool-validation is now just an additive alias so nothing
# breaks for existing callers).
tool-validation    = ["wasm-interpreter"]
# `host-fs` enables code paths that consume std::path::PathBuf scope-roots
# and read skill markdown via std::fs. Embassy ships without this feature.
# It is a host-only (std) path: its skill-resolution code uses the std-only
# `tau-domain` ctors (`Message::new`/`AgentInstanceId::new`, needing wall-clock
# + `uuid::now_v7`), so pull `tau-domain/std` here. The no_std guest build
# enables neither `host-fs` nor any std, so it stays std-free. (Before EPIC 0
# this std came incidentally via `tool-validation -> tau-domain/std`, removed
# in PR-0b.)
host-fs            = ["dep:globset", "tau-domain/std"]
# `schema` exposes JsonSchema derives on RunEvent/RunOutcome (and their
# transitive leaf types) for the frozen schemas/run-event/ export. See
# crates/tau-runtime-core/tests/run_event_schema.rs.
schema             = ["dep:schemars", "tau-ports/schema", "tau-domain/schema"]

# Host/std bundle — the full former default surface. Host consumers opt in via
# `features = ["std"]` now that the `tau-runtime-core` workspace alias sets
# `default-features = false` (so the no_std wasm guest can link the same alias
# without dragging in std via `host-fs → tau-domain/std`). Includes
# `tool-validation` so host builds keep running ADR-0010 schema validation.
std = ["process", "capability-override", "tool-validation", "host-fs"]

default = ["std"]
# Activates DeterministicRandom fallback in invoke_tool for test paths.
test-fixtures = ["tau-ports/test-fixtures"]

[dev-dependencies]
# toml + proptest: used by capability.rs unit/property tests (Task 3.3).
toml           = { workspace = true }
proptest       = { workspace = true }
assert_matches = { workspace = true }
# `std` so tests can use the std-only `Message::new`/`AgentInstanceId::new`
# convenience ctors; `package-source`/`skill-md` for skill-resolve tests.
tau-domain     = { workspace = true, features = ["test-fixtures", "std", "package-source", "skill-md"] }
# test-fixtures enables MockLlmBackend, MockTool, MockStorage for builder tests.
tau-ports      = { workspace = true, features = ["test-fixtures", "process"] }
serde_json     = { workspace = true }
# futures-executor: Task 3.8 executor-agnostic smoke test.
futures-executor = "0.3"
# futures-util: StreamExt for collecting run_ir_streaming's RunEvent stream
# in tests/run_ir_streaming.rs.
futures-util = "0.3"
# tokio: stream.rs tests use #[tokio::test] for async-stream consumption.
tokio          = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# async-stream macro reused in tests for synthesizing LLM streams.
async-stream   = { workspace = true }
# Self-reference with `test-fixtures` so integration tests (tests/) build
# the lib with the clock/random auto-inject path in run_agent active —
# `pipeline_executor.rs` drives `run_pipeline` -> `run_agent`, which
# panics unless test-fixtures is enabled.
tau-runtime-core = { workspace = true, features = ["std", "test-fixtures"] }
# tracing-subscriber: captured-events layer for pipeline trace-event tests.
tracing-subscriber = { workspace = true }

[lints]
workspace = true
