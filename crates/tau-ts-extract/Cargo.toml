[package]
name = "tau-ts-extract"
description = "TypeScript source extractor — produces ProjectConfig from project.ts via swc-based static analysis"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
swc_ecma_parser = "45"
swc_ecma_ast    = "29"
swc_common      = { version = "26", features = ["tty-emitter"] }
tau-pkg         = { workspace = true }
anyhow          = { workspace = true }
thiserror       = { workspace = true }
serde_json      = { workspace = true }

[dev-dependencies]
tau-ir       = { workspace = true }
tau-ir-lower = { workspace = true }
tau-ports    = { workspace = true }

[lints]
workspace = true
