[project]
name = "deliverables-goals-conformance"

[tools.write_file]
native = "WriteFile"
capabilities = [{ kind = "fs.write", paths = ["/workspace/**"] }]

[agents.gather]
display_name = "Gather"
package = "research@^0.1"
llm_backend = "anthropic"
model = "claude-haiku-4-5"

[agents.writer]
display_name = "Writer"
package = "research@^0.1"
llm_backend = "anthropic"
model = "claude-haiku-4-5"
produces = ["/workspace/report.md"]
tool_refs = ["write_file"]

[[pipeline.steps]]
id = "gather"
run = "agent:gather"
input = "${input}"

[[pipeline.steps]]
id = "writer"
run = "agent:writer"
input = "${steps.gather.output}"

[goals.has_sources]
evaluates = "/workspace/report.md"
check = "matches"
pattern = "(?m)^## Sources"

[deliverables.report]
path = "/workspace/report.md"
must_satisfy = "A coherent summary."
on_fail = "retry"
max_attempts = 3
retry_from = "writer"
