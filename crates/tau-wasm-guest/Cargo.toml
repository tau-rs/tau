[package]
name = "tau-wasm-guest"
description = "β.7.5 wasm component guest: drives the tau IR via tau-runtime-core inside a WASI 0.2 component. no_std + alloc; built only for wasm32-wasip2 (empty on any other target)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lib]
crate-type = ["cdylib"]

# wasm-only dependency graph. On host targets this crate is intentionally
# empty (see src/lib.rs), so the guest's no_std deps are not pulled into
# `cargo check --workspace` / host test builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
dlmalloc    = { workspace = true }
tau-ir = { workspace = true }
# The `tau-runtime-core` alias now sets `default-features = false`, so the guest
# links it through the plain `workspace = true` alias and opts into only the
# no_std surface it needs — no host defaults (capability-override→globset,
# host-fs→tau-domain/std) are dragged in. Host/std consumers re-enable those
# with `features = ["std"]`.
#
# `tool-validation` IS enabled: post-EPIC-0 it is no_std (the no_std schema
# validator replaced jsonschema), so the guest validates tool args exactly
# like the host — `RuntimeBuilder::build()` compiles validators from the
# baked IR's tool input_schemas. This keeps host/guest conformance parity
# (a guest that skipped validation would diverge from the host's BadArgs
# self-correction trace).
tau-ports = { workspace = true, default-features = false, features = ["serde"] }
tau-runtime-core = { workspace = true, features = ["wasm-interpreter", "tool-validation"] }
tau-native-tools = { path = "../tau-native-tools", default-features = false }
futures-core = { workspace = true, default-features = false, features = ["alloc"] }
serde_json = { workspace = true }

[dev-dependencies]
tau-ports = { workspace = true }

[lints]
workspace = true
