[package]
name = "tau-wasm-guest"
description = "β.7.5 wasm component guest: drives the tau IR via tau-runtime-core inside a WASI 0.2 component. no_std + alloc; built only for wasm32-wasip2 (empty on any other target)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lib]
crate-type = ["cdylib"]

# wasm-only dependency graph. On host targets this crate is intentionally
# empty (see src/lib.rs), so the guest's no_std deps are not pulled into
# `cargo check --workspace` / host test builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { workspace = true }
dlmalloc    = { workspace = true }
tau-ir = { workspace = true, default-features = false }
# Direct path dep (not the `workspace = true` alias): the alias omits
# `default-features`, so cargo would IGNORE this `default-features = false`
# and pull runtime-core's host-only defaults (tool-validation→jsonschema,
# capability-override→globset, host-fs), which drag in std. The guest is the
# only no_std consumer, so it opts out locally rather than inverting the
# alias default for the 5 host crates that legitimately want those features.
tau-runtime-core = { path = "../tau-runtime-core", default-features = false }
serde_json = { workspace = true }
