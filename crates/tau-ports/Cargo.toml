[package]
name = "tau-ports"
description = "Port (trait) definitions for tau's hexagonal architecture."
version                = "0.6.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
tau-domain   = { workspace = true }
thiserror    = { workspace = true }
futures-core = { workspace = true }
uuid         = { workspace = true }
serde        = { workspace = true, optional = true }
schemars     = { workspace = true, optional = true, features = ["derive"] }
chrono = { workspace = true, default-features = false, features = ["alloc", "serde"] }
zeroize = { workspace = true }
tempfile     = { workspace = true, optional = true }
# Non-optional: `PipelineSuspension.outputs` uses `serde_json::Value` as a
# plain (de)serialization-agnostic value type, independent of the `serde`
# feature (whose derives are cfg-gated). The workspace pin is
# `default-features = false, features = ["alloc"]`, so this stays no_std-clean.
serde_json   = { workspace = true }

[features]
default       = ["process"]
# `process` brings std-typed fields (e.g. `WorkingContext.working_dir:
# Option<PathBuf>`) into serde-derived structs. When serde is also enabled,
# those derives need serde's `std` impls — pull them weakly so `process`
# alone (no serde) and `serde` alone (no process, the no_std path) are both
# unaffected. Without this, an isolated `-p tau-ports`/`-p tau-runtime-core`
# default build fails unless some other crate happens to pull `serde/std`.
process       = ["serde?/std"]
serde         = ["dep:serde", "tau-domain/serde", "uuid/serde"]
schema        = ["dep:schemars", "tau-domain/schema"]
test-fixtures = ["dep:tempfile"]

[dev-dependencies]
tokio        = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
futures      = "0.3"
proptest     = { workspace = true }
# serde_json is a normal (non-optional) dependency above; tests use it via
# that entry.
# `std` so tests can use std-only `AgentInstanceId::new` / `Uuid::now_v7`.
tau-domain   = { workspace = true, features = ["serde", "test-fixtures", "std"] }
uuid         = { workspace = true, features = ["std"] }
tempfile     = { workspace = true }

[lints]
workspace = true
