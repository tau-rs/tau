[package]
name = "tau-ports"
description = "Port (trait) definitions for tau's hexagonal architecture."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
tau-domain   = { workspace = true }
thiserror    = { workspace = true }
futures-core = { workspace = true }
uuid         = { workspace = true }
serde        = { workspace = true, optional = true }
schemars     = { workspace = true, optional = true }
chrono = { workspace = true, default-features = false, features = ["alloc", "serde"] }
zeroize = { workspace = true }
tempfile     = { workspace = true, optional = true }
tracing = { workspace = true, default-features = false, features = ["attributes"] }

[features]
default       = ["process"]
# `process` brings std-typed fields (e.g. `WorkingContext.working_dir:
# Option<PathBuf>`) into serde-derived structs. When serde is also enabled,
# those derives need serde's `std` impls — pull them weakly so `process`
# alone (no serde) and `serde` alone (no process, the no_std path) are both
# unaffected. Without this, an isolated `-p tau-ports`/`-p tau-runtime-core`
# default build fails unless some other crate happens to pull `serde/std`.
process       = ["serde?/std"]
serde         = ["dep:serde", "tau-domain/serde", "uuid/serde"]
schema        = ["dep:schemars"]
test-fixtures = ["dep:tempfile"]

[dev-dependencies]
tokio        = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
futures      = "0.3"
proptest     = { workspace = true }
serde_json   = "1"
# `std` so tests can use std-only `AgentInstanceId::new` / `Uuid::now_v7`.
tau-domain   = { workspace = true, features = ["serde", "test-fixtures", "std"] }
uuid         = { workspace = true, features = ["std"] }
tempfile     = { workspace = true }
# Parse the committed WIT host world to assert its frozen 3-function surface
# (EPIC 2.3). std/test-only. Pin to the version already in Cargo.lock
# (transitive via wit-bindgen 0.58) so no second copy is pulled.
wit-parser   = "0.251"
