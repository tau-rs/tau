[package]
name = "tau-pkg"
description = "Tau package manager: install, resolve, and manage extension packages."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[dependencies]
tau-domain            = { workspace = true, features = ["serde", "skill-md", "package-source"] }
tau-ir                = { workspace = true }
tau-plugin-protocol   = { workspace = true }
tau-ports             = { workspace = true, features = ["serde"] }
thiserror             = { workspace = true, features = ["std"] }
toml                  = { workspace = true }
serde                 = { workspace = true }
serde_yaml            = { workspace = true }
# Source-agnostic whole-tree SHA-256 for `tau verify` (ADR-0012 / priority 7).
sha2            = { workspace = true }
walkdir         = { workspace = true }
fs4             = { workspace = true }
humantime-serde = { workspace = true }
# RFC 3339 timestamp formatting for `bundle.created_at` (excluded from
# self-hash; informational only). Same crate tau-cli already uses.
humantime       = "2"
semver          = { workspace = true }
tempfile        = { workspace = true }
tracing         = { workspace = true }
tokio           = { workspace = true, features = ["process", "io-util", "macros", "rt", "time"] }
rmp-serde       = { workspace = true }
serde_json      = "1"
globset         = { workspace = true }
regex           = { workspace = true }

[features]
default = []

[dev-dependencies]
proptest   = { workspace = true }
# `tau_ports::fixtures::scratch_dir` for labeled tempdir creation
# (T7 of the test-suite-upgrades plan). Test-fixtures feature only.
tau-ports  = { workspace = true, features = ["test-fixtures", "serde", "process"] }
# Capturing subscriber for the install-diagnostics tracing tests
# (asserts target/level/fields + RUST_LOG-style EnvFilter honoring).
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }

[lints]
workspace = true
