[package]
name = "tau-pkg-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone Cargo project — NOT part of the workspace. cargo-fuzz expects
# this layout so the `[lib]` injection from `cargo fuzz init` doesn't pollute
# the parent workspace. Run with:
#
#     rustup toolchain install nightly
#     cargo install cargo-fuzz
#     cd crates/tau-pkg/fuzz && cargo +nightly fuzz run lockfile_from_toml_str
#
# See README.md in this directory.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tau-pkg = { path = ".." }

[[bin]]
name = "lockfile_from_toml_str"
path = "fuzz_targets/lockfile_from_toml_str.rs"
test = false
doc = false
bench = false

# Cargo-fuzz–specific profile tuning. The default release profile already
# turns on optimizations and debug-assertions; this is just to make the
# layout explicit and add `panic = "abort"` (libFuzzer expects abort).
[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
# Empty workspace block: cargo treats this manifest as its own workspace root
# so it does not try to attach to the outer workspace. The root Cargo.toml
# `exclude` entry is NOT sufficient on its own for a package nested under a
# member crate directory — without this table every `cargo fuzz` invocation
# dies with "current package believes it is in a workspace when it is not",
# which is why Fuzz nightly failed at build for months. Mirrors the marker in
# crates/tau-mcp-tokio/tests/fixtures/mock-mcp-server/Cargo.toml.
