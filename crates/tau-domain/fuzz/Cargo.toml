[package]
name = "tau-domain-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone Cargo project — NOT part of the workspace. Mirrors the
# layout used by crates/tau-pkg/fuzz and crates/tau-plugin-protocol/fuzz;
# see README.md in this directory.

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tau-domain = { path = "..", features = ["serde"] }
toml = "1.1"

[[bin]]
name = "parse_skill_md"
path = "fuzz_targets/parse_skill_md.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_package_manifest"
path = "fuzz_targets/parse_package_manifest.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

[workspace]
# Empty workspace block: cargo treats this manifest as its own workspace root
# so it does not try to attach to the outer workspace. The root Cargo.toml
# `exclude` entry is NOT sufficient on its own for a package nested under a
# member crate directory — without this table every `cargo fuzz` invocation
# dies with "current package believes it is in a workspace when it is not",
# which is why Fuzz nightly failed at build for months. Mirrors the marker in
# crates/tau-mcp-tokio/tests/fixtures/mock-mcp-server/Cargo.toml.
