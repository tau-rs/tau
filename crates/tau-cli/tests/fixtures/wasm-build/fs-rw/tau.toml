packages = ["anthropic"]

[project]
name = "fs-rw-wasm"
version = "0.1.0"

[models.claude]
backend = "anthropic"
model = "claude-sonnet-4-6"

[agents.main]
display_name = "Main"
package = "fs-rw-wasm@^0.1"
model = "claude"
tool_refs = ["read_file", "write_file"]

[agents.main.prompt]
system = "Uses fs.read and fs.write tools over nested grants."

[tools.read_file]
native = "Read"
description = "Read a file from a granted path."
capabilities = [{ kind = "fs.read", paths = ["/data/**"] }]

[tools.write_file]
native = "Write"
description = "Replace a file's content at a granted path."
capabilities = [{ kind = "fs.write", paths = ["/data/logs/**"] }]
