[project]
name = "needs-dynamic-region-wasm"
version = "0.1.0"

[allow]
"net.http" = { hosts = ["api.crawler.test"] }

[allow.models.fast]
backend = "coordbackend"
model = "m-1"

[agents.coordinator]
display_name = "Coordinator"
package      = "coordbackend@^0.1"
model        = "fast"

[agent.kinds.researcher]
capabilities = { "net.http" = { hosts = ["api.crawler.test"] } }
prompt = "You are a researcher."
model = "fast"

# A bounded dynamic region (EPIC 4.4) — no target executes one yet (the
# interpreter returns DynamicRegionRequiresRuntimeGate, pending EPIC 4.5), so
# `any-wasi-strict` omits it from supported_features and `tau build wasm`
# must refuse it. Branch/Parallel/Loop, by contrast, now run in-guest via
# run_pipeline (ADR-0068, #621); Suspend stays refused for want of a
# SuspensionStore channel.
[[pipeline.steps]]
id = "fanout"

[pipeline.steps.dynamic]
spawns = ["researcher"]
ceiling = { "net.http" = { hosts = ["api.crawler.test"] } }
max_spawns = 4
max_concurrency = 2
agent = "coordinator"
