# The cross-epic north-star demo (issue #461, slicing-policy rule 5):
# ONE [allow]-governed workflow using Branch + Loop, capability-bounded,
# runnable in dev (`tau run`) and as a built artifact (`tau run --bundle`).
# `tau build --target wasm-guest` refuses it at feature-fit (ADR-0059):
# control-flow is not yet executable in the wasm guest — that leg extends
# this same fixture when guest control-flow lands.
#
# Exercised by crates/tau-cli/tests/north_star_demo.rs, which supplies the
# echo-llm plugin scaffold (.tau/config.toml, package manifest, lockfile).

[project]
name = "north-star"
version = "0.1.0"

# The constitution: nothing in this project may exceed these ceilings.
[allow]
"fs.read" = { paths = ["/data/incidents/**"] }

[allow.models.default]
backend = "echo-llm"
model = "claude-haiku-4-5"

# Per-tool ceiling (kind-as-key): read_temp may never claim more than this.
[allow.tools.read_temp]
native = "ReadTemp"
"fs.read" = { paths = ["/data/incidents/**"] }

[agents.triage]
display_name = "Triage"
package      = "echo-llm@^0.1"
model        = "default"
tool_refs    = ["read_temp"]

[agents.triage.prompt]
system = "Classify the incoming incident report."

# The echo-llm plugin replays this text as every step's output (ONE
# backend instance, configured from the ENTRY agent — `triage`, the
# positional agent id on both the dev and the bundle path since #623).
# It deliberately carries BOTH markers: "URGENT" drives the branch's
# then-arm, "APPROVED" satisfies the loop's until-predicate on the first
# iteration. Every OTHER agent carries a decoy config with NEITHER
# marker: if entry resolution ever regresses to alphabetical-first
# (`oncall`), the branch takes the wrong arm and the loop exhausts, so
# the run hard-errors — the differentiated configs ARE the #623 witness.
[agents.triage.config]
canned_text = "URGENT: coolant temperature rising - fan engaged. APPROVED"

[agents.oncall]
display_name = "On-call"
package      = "echo-llm@^0.1"
model        = "default"

[agents.oncall.prompt]
system = "Escalate the incident to the on-call rotation."

[agents.oncall.config]
canned_text = "decoy config (not the entry agent) - routine, nothing to sign off"

[agents.scribe]
display_name = "Scribe"
package      = "echo-llm@^0.1"
model        = "default"

[agents.scribe.prompt]
system = "Acknowledge the routine report."

[agents.scribe.config]
canned_text = "decoy config (not the entry agent) - routine, nothing to sign off"

[agents.reviewer]
display_name = "Reviewer"
package      = "echo-llm@^0.1"
model        = "default"

[agents.reviewer.prompt]
system = "Draft the incident summary; revise until approved."

[agents.reviewer.config]
canned_text = "decoy config (not the entry agent) - routine, nothing to sign off"

[agents.reporter]
display_name = "Reporter"
package      = "echo-llm@^0.1"
model        = "default"

[agents.reporter.prompt]
system = "Publish the final incident report."

[agents.reporter.config]
canned_text = "decoy config (not the entry agent) - routine, nothing to sign off"

# Capability-bounded native tool: its declared caps narrow the [allow]
# fs.read ceiling above (sensors/ subtree only). The over-reach twin
# breaks exactly this contract.
[tools.read_temp]
native      = "ReadTemp"
description = "Read the incident sensor temperature."
capabilities = [{ kind = "fs.read", paths = ["/data/incidents/sensors/**"] }]

[pipeline]

[[pipeline.steps]]
id = "triage"
run = "agent:triage"
input = "${input}"

# Branch: urgent incidents escalate; routine ones get acknowledged.
[[pipeline.steps]]
id = "route"
branch = { evaluates = "steps.triage.output", check = "matches", pattern = "(?i)urgent" }

  [[pipeline.steps.then]]
  id = "escalate"
  run = "agent:oncall"
  input = "${steps.triage.output}"

  [[pipeline.steps.otherwise]]
  id = "ack"
  run = "agent:scribe"
  input = "${steps.triage.output}"

# Bounded Loop: redraft until the reviewer approves, at most 3 times.
# `until` exhaustion is a hard error, so the run only completes because
# the draft output satisfies the predicate within the bound. (Nested
# steps see only the outer top-level scope — `draft` may read `triage`
# but not `escalate`, which lives inside the `route` subtree.)
[[pipeline.steps]]
id = "review"
until = { evaluates = "steps.draft.output", check = "matches", pattern = "APPROVED" }
max_iters = 3

  [[pipeline.steps.body]]
  id = "draft"
  run = "agent:reviewer"
  input = "${steps.triage.output}"

# Leaf final step (Branch/Loop store no output; the pipeline renderer
# renders the LAST leaf step). A top-level step may reference nested
# descendants of earlier top-level steps, and template resolution
# hard-errors on unresolved refs — so a completed run proves BOTH that
# the branch's then-arm ran (escalate) and that the loop body ran (draft).
[[pipeline.steps]]
id = "report"
run = "agent:reporter"
input = "escalation: ${steps.escalate.output} / draft: ${steps.draft.output}"
