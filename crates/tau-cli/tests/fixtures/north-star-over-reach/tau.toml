# Negative twin of ../north-star: read_temp over-reaches the [allow]
# fs.read ceiling (/etc/** vs /data/incidents/**), so
# `tau check governance` must fail with exit 2. Everything else is
# identical to the governed fixture — the ONLY delta is the tool's
# declared capabilities escaping the constitution.

[project]
name = "north-star-over-reach"
version = "0.1.0"

[allow]
"fs.read" = { paths = ["/data/incidents/**"] }

[allow.models.default]
backend = "echo-llm"
model = "claude-haiku-4-5"

[allow.tools.read_temp]
native = "ReadTemp"
"fs.read" = { paths = ["/data/incidents/**"] }

[agents.triage]
display_name = "Triage"
package      = "echo-llm@^0.1"
model        = "default"
tool_refs    = ["read_temp"]

[agents.triage.prompt]
system = "Classify the incoming incident report."

[agents.triage.config]
canned_text = "URGENT: coolant temperature rising - fan engaged. APPROVED"

[agents.oncall]
display_name = "On-call"
package      = "echo-llm@^0.1"
model        = "default"

[agents.oncall.prompt]
system = "Escalate the incident to the on-call rotation."

[agents.oncall.config]
canned_text = "URGENT: coolant temperature rising - fan engaged. APPROVED"

[agents.scribe]
display_name = "Scribe"
package      = "echo-llm@^0.1"
model        = "default"

[agents.scribe.prompt]
system = "Acknowledge the routine report."

[agents.scribe.config]
canned_text = "URGENT: coolant temperature rising - fan engaged. APPROVED"

[agents.reviewer]
display_name = "Reviewer"
package      = "echo-llm@^0.1"
model        = "default"

[agents.reviewer.prompt]
system = "Draft the incident summary; revise until approved."

[agents.reviewer.config]
canned_text = "URGENT: coolant temperature rising - fan engaged. APPROVED"

[agents.reporter]
display_name = "Reporter"
package      = "echo-llm@^0.1"
model        = "default"

[agents.reporter.prompt]
system = "Publish the final incident report."

[agents.reporter.config]
canned_text = "URGENT: coolant temperature rising - fan engaged. APPROVED"

# OVER-REACH: /etc/** is outside the /data/incidents/** ceiling.
[tools.read_temp]
native      = "ReadTemp"
description = "Read the incident sensor temperature."
capabilities = [{ kind = "fs.read", paths = ["/etc/**"] }]

[pipeline]

[[pipeline.steps]]
id = "triage"
run = "agent:triage"
input = "${input}"

[[pipeline.steps]]
id = "route"
branch = { evaluates = "steps.triage.output", check = "matches", pattern = "(?i)urgent" }

  [[pipeline.steps.then]]
  id = "escalate"
  run = "agent:oncall"
  input = "${steps.triage.output}"

  [[pipeline.steps.otherwise]]
  id = "ack"
  run = "agent:scribe"
  input = "${steps.triage.output}"

[[pipeline.steps]]
id = "review"
until = { evaluates = "steps.draft.output", check = "matches", pattern = "APPROVED" }
max_iters = 3

  [[pipeline.steps.body]]
  id = "draft"
  run = "agent:reviewer"
  input = "${steps.triage.output}"

[[pipeline.steps]]
id = "report"
run = "agent:reporter"
input = "escalation: ${steps.escalate.output} / draft: ${steps.draft.output}"
