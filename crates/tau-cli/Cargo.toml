[package]
name = "tau-cli"
description = "Command-line interface for tau."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "tau"
path = "src/main.rs"

[dependencies]
tau-domain          = { workspace = true, features = ["serde"] }
tau-pkg             = { workspace = true }
tau-ports           = { workspace = true }
tau-plugin-protocol = { workspace = true }
tau-runtime-core    = { workspace = true, features = ["std"] }
tau-runtime-tokio   = { workspace = true }
tau-workflow        = { workspace = true }
tau-app             = { workspace = true }
tau-observe         = { workspace = true, features = ["non_blocking"] }
tau-ir              = { workspace = true }
tau-ir-lower        = { workspace = true }
tau-mcp             = { workspace = true, features = ["with-std-adapters"] }
tau-mcp-tokio       = { workspace = true }
tau-ts-extract      = { path = "../tau-ts-extract" }
futures-core        = { workspace = true }
base64             = { workspace = true }
humantime          = "2"
humantime-serde    = { workspace = true }
rmp-serde          = { workspace = true }
rmpv               = { workspace = true }
semver             = { workspace = true }
clap               = { version = "4", features = ["derive", "env"] }
tokio              = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde              = { workspace = true }
serde_json         = "1"
toml               = { workspace = true }
thiserror          = { workspace = true }
# UUID v7 for session ids (ADR-0013 / Tier 3 priority 11).
uuid               = { workspace = true }
# ULIDs are minted in `run_main` for workflow-run invocations so the
# `WorkflowRunLogLayer` attached to the global subscriber agrees with
# the `Runner`'s `RunOpts::run_id` on the on-disk log path.
ulid               = { workspace = true }
anyhow             = "1"
chrono             = { workspace = true }
termimad           = "0.34"
rustyline          = "18"
notify             = "8"
is-terminal        = "0.4"
tempfile           = { workspace = true }
# SHA-256 over the native-tool symbolic name in `cmd::build::lower_ir`
# until a real native-tool registry lands in `tau-pkg`.
sha2               = { workspace = true }
# Regex matching for the `FN_BUILTIN_MATCHES` goal predicate (Task 22).
regex              = { workspace = true }
# JSON Schema validation for the `FN_BUILTIN_SCHEMA_VALID` goal predicate (Task 22).
jsonschema         = { workspace = true }

[dev-dependencies]
assert_cmd       = "2"
assert_fs        = "1"
insta            = { version = "1", features = ["yaml", "json", "redactions"] }
predicates       = "3"
proptest         = { workspace = true }
rstest           = { workspace = true }
tempfile         = "3"
url              = { workspace = true }
walkdir          = { workspace = true }
# test-fixtures feature needed by tests/common/mock_llm.rs (T9: orchestration pattern tests).
tau-ports        = { workspace = true, features = ["test-fixtures", "serde"] }
# Task 4: e2e tau build wasm → wasmtime → typed RunEvent stream (β.7.5 PR-E2).
tau-wasm-host    = { path = "../tau-wasm-host" }

[features]
# Production `tau` binary ships with OTLP support enabled out of the box.
# Runtime opt-in via `--otlp-endpoint` flag (or `OTEL_EXPORTER_OTLP_ENDPOINT`
# env var); compile-time opt-out via `--no-default-features`.
default = ["otlp"]
# Forwards to `tau-observe/otlp`: enables the optional OpenTelemetry/OTLP
# exporter wiring in the CLI.
otlp = ["tau-observe/otlp"]
