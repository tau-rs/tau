# cargo-deny: supply-chain gate, Tier 1.
#
# Advisories arrive independently of commits, which is why this also runs on a
# schedule (Tier 3) rather than only when someone happens to push.

[advisories]
version = 2
# An ignore entry here is a decision to ship a known advisory; it must carry
# a comment naming the advisory, the reason, and the condition under which it
# is removed. Nothing below is a vulnerability: both are `unmaintained`
# notices on crates that only `kernel/benches/kpi_ir.rs` reaches, through
# `iai-callgrind` (a dev-dependency; the bench target ships nothing).
ignore = [
    # bincode 1.3.3, which iai-callgrind uses to talk to its runner binary.
    # Its authors call 1.3.3 finished rather than abandoned. Removed when
    # iai-callgrind moves off bincode 1.
    "RUSTSEC-2025-0141",
    # proc-macro-error2, reached through iai-callgrind-macros. Also carries
    # a future-incompatibility warning (E0365, a private `proc_macro`
    # re-export), which the pinned toolchain accepts; a toolchain bump that
    # makes it a hard error forces the iai-callgrind upgrade. Removed when
    # iai-callgrind-macros drops it.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
allow = [
    "MIT",
    # MIT with the attribution clause removed: strictly weaker than MIT.
    # Reached through `borrow-or-share` (via `fluent-uri`, via `boon`), the
    # tool loop's JSON Schema validator.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # University of Illinois/NCSA: BSD-style, permissive. The LLVM libFuzzer
    # runtime bundled in `libfuzzer-sys` is `(MIT OR Apache-2.0) AND NCSA`.
    # Reached only from fuzz/, which is not a workspace member and ships nothing.
    "NCSA",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A registry dependency with no version bound is a supply-chain hole. A
# *path* dependency without one is just a workspace-internal edge — the
# kernel's self dev-dependency, which enables the `testing` feature for its own
# test targets and nothing else.
allow-wildcard-paths = true
# The kernel is a dependency of every harness that embeds tau. A duplicate of a
# heavyweight transitive dep is a compile-time and binary-size tax paid by every
# one of them.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
