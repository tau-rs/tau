[package]
name        = "tau-drivers"
description = "Drivers for the tau kernel: the border guards between envelopes and the world."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lib]
name = "tau_drivers"

[[bin]]
name              = "tau-sandbox-shim"
path              = "src/bin/tau-sandbox-shim.rs"
required-features = ["sandbox"]

# The scripted stand-in for an agent CLI (ADR-0013 §10): replays a stdout
# transcript and reacts to stdin lines and signals as a JSONL script says.
# Dev-only; every agent test points `AgentConfig::binary` at it.
[[bin]]
name              = "tau-fake-cli"
path              = "src/bin/tau-fake-cli.rs"
required-features = ["agent"]

[features]
default   = ["anthropic", "openai", "sandbox", "agent", "agent-claude", "agent-codex"]
# The Anthropic Messages API model driver (ADR-0006 §6, Anthropic column).
anthropic = ["dep:reqwest", "dep:tokio"]
# The OpenAI-compatible chat-completions driver (ADR-0006 §6, right-hand
# column): OpenAI itself, vLLM, and everything else that speaks the shape.
openai    = ["dep:reqwest", "dep:tokio"]
# The sandbox driver and its supervisor binary (ADR-0009). Unix-only: the
# module and the binary are empty elsewhere.
sandbox   = ["dep:tokio", "dep:nix", "dep:signal-hook", "dep:schemars"]
# The shared half of the agent drivers (ADR-0013): the wire, the worker
# envelope and its tolerant parser, subprocess supervision with the cancel
# ladder, the config and the auth probe. Unix-only, like `sandbox`; the two
# CLI adapters (#127, #128) arrive behind their own features on top of it.
# Deliberately no `reqwest`: an agent driver spawns a binary and reads its
# stdout, and never speaks to a provider itself (ADR-0013 §8).
# `signal-hook` is for `tau-fake-cli` alone: the driver sends signals, it
# never receives them.
agent     = ["dep:nix", "dep:schemars", "dep:signal-hook"]
# The `claude` adapter (ADR-0013 §7, the `claude` column): Claude Code in
# print mode behind `send`. `tokio` for the one-shot channel between the run
# thread and the kernel's future, `sync` only; still no `reqwest`.
agent-claude = ["agent", "dep:tokio"]
# The `codex` adapter (ADR-0013 §7, the `codex` column): `codex exec --json`
# behind `send`. `tokio` for the one-shot channel between the run thread and
# the kernel's future, `sync` only; still no `reqwest`.
agent-codex = ["agent", "dep:tokio"]

[dependencies]
tau-kernel = { path = "../kernel", version = "0.0.0" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
reqwest    = { workspace = true, optional = true }
# This crate is the first tokio-native consumer of the kernel; the kernel
# itself stays executor-agnostic (ADR-0003). `select!` needs `macros`.
tokio      = { workspace = true, features = ["sync", "time", "macros"], optional = true }
nix        = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }
schemars   = { workspace = true, optional = true }

[dev-dependencies]
# The stub HTTP server the tests answer from, and the runtime that drives the
# kernel in the integration tests.
tokio      = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# The real tool loop, run over this driver against the stub: the test that
# the second call of a tool exchange replays the thinking blocks (ADR-0007).
libtau     = { path = "../libtau", version = "0.0.0" }
# The validator libtau refuses a tool call with, pointed at each projected
# schema: a self-compared fixture cannot see a schema that refuses every
# input (#200).
boon       = { workspace = true }

[lints]
workspace = true
