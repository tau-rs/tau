[package]
name        = "tau-kernel"
description = "The tau agent kernel: seven syscalls, an event-sourced core, capability security."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lib]
name = "tau_kernel"

[features]
# Exposes constructors that the kernel's own allocators own in production, so
# that test targets can build ABI values without a running kernel. Enabled only
# by the self dev-dependency below; no downstream crate can turn it on usefully,
# because forging a value confers no authority (see `abi::Capability`).
testing = []

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
insta      = { workspace = true }
# The kernel is executor-agnostic: syscalls are plain futures over std wakers.
# tokio is the harness's choice (ADR-0003), and the only harness today is the
# end-to-end test, so it is a dev-dependency.
tokio      = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tau-kernel = { path = ".", features = ["testing"] }
criterion  = { workspace = true }
# The fold bench feeds the reducer a seeded, realistic log, and the sim crate
# is the generator of those (`run_unchecked`). sim depends on the kernel as a
# normal dependency, so this edge closes a dev-dependency cycle, which cargo
# permits: the kernel lib is built once and both sides link the same artifact.
tau-sim    = { path = "../sim" }
# The same two KPIs counted under callgrind (`benches/kpi_ir.rs`): the
# number the Tier 3 nightly judges (#151). The `benchmark` feature (default)
# is the attribute macros plus the runner's API types; the runner binary is
# installed on the CI runner at this exact version, not built here.
iai-callgrind = { workspace = true }

# ADR-0003's two KPIs: reducer throughput in entries/sec and send→deliver
# latency. Not on the `just check` path; `cargo bench -p tau-kernel --no-run`
# is what must stay green (Tier 2 item 7, #40).
[[bench]]
name    = "kpi"
harness = false

# The instruction-count twin of `kpi`, judged nightly against
# `benches/kpi_ir.baseline.tsv` (Tier 3 item 5, #151).
[[bench]]
name    = "kpi_ir"
harness = false

[lints]
workspace = true
