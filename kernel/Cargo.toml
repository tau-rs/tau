[package]
name        = "tau-kernel"
description = "The tau agent kernel: seven syscalls, an event-sourced core, capability security."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lib]
name = "tau_kernel"

# The binary ships as `tau` from the `tau-kernel` crate (HANDOFF: `cargo
# install tau-kernel` gives `tau`, the ripgrep -> rg pattern). It uses only
# the crate's public API; the `testing` feature is not on its path.
[[bin]]
name = "tau"
path = "src/bin/tau.rs"

[features]
# Exposes constructors that the kernel's own allocators own in production, so
# that test targets can build ABI values without a running kernel. Enabled only
# by the self dev-dependency below; no downstream crate can turn it on usefully,
# because forging a value confers no authority (see `abi::Capability`).
testing = []

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
insta      = { workspace = true }
# The kernel is executor-agnostic: syscalls are plain futures over std wakers.
# tokio is the harness's choice (ADR-0003), and the only harness today is the
# end-to-end test, so it is a dev-dependency.
tokio      = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tau-kernel = { path = ".", features = ["testing"] }

[lints]
workspace = true
