# VISION FIXTURE — the one-stanza CI gate an app adopts (worked-examples B5).
# The whole governance story in PR review is this step's exit code:
#   0 = no change · 2 = changes (report) · 3 = WIDENS CAPABILITIES (block) · 1 = error

name: ci
on: [pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx tau check          # constitution + vocabulary + choreography
      - run: npx tsc --noEmit       # the app type-checks AGAINST tau.gen.ts
      - run: npx tau plan --check   # exit 3 blocks: a human reads the permission sheet
