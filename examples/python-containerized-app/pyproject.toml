[project]
name = "python-containerized-app"
version = "0.1.0"
description = "Dummy Python app demonstrating containerization with uv"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
]

[project.scripts]
serve = "app.main:run"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
]
