[workspace]
resolver = "2"
members = ["kernel", "drivers", "libtau", "sim", "store"]
# The fuzz crate is deliberately not a member: it only means anything under
# nightly's sanitizer flags, and a member would put libFuzzer's C++ runtime on
# the `just check` path. It has its own lockfile; see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version      = "0.0.0"
edition      = "2021"
rust-version = "1.97"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tau-rs/tau"
authors      = ["Titouan Lebocq <lebocq.tit@gmail.com>"]

[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
# `float_roundtrip`: serde_json's default float parser is fast and not
# correctly rounded — a tool-call `input` holding `1.2999999999999999e+73`
# decoded, re-encoded, and decoded again is a different f64. The fuzz target
# on `decode_reply` found it in its first fifteen minutes. The tool loop
# forwards the model's numbers to tool drivers, so they must survive intact;
# the cost lands on float parsing only, and the kernel's log has no floats.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2       = "0.10"
thiserror  = "2"
tokio      = { version = "1", default-features = false }
# rustls with the platform root store: reqwest's bundled `webpki-roots` is
# CDLA-Permissive-2.0, which deny.toml does not allow; the native store is not.
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
insta      = { version = "1", features = ["json"] }
# JSON Schema (draft 2020-12) validation for the tool loop's `bad_args`
# (ADR-0006 §4). No HTTP resolver, no network: schemas come from `describe()`.
boon       = "0.6"
# Property tests (HANDOFF §8, Tier 2 item 1). No `fork`/`timeout`: the
# reducer is a pure fold, so a case cannot hang, and both would drag in
# rusty-fork and tempfile for nothing.
proptest   = { version = "1", default-features = false, features = ["std"] }
# Benches (ADR-0003 KPIs). No default features: `rayon` and `plotters` would
# ride along on the `just check` path, because clippy runs `--all-targets`;
# `cargo_bench_support` is what makes `cargo bench` and its filters work.
criterion  = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# The sandbox driver's shim (ADR-0009 §4): rlimits, process-group kill and
# `getrusage` through safe wrappers, since the workspace forbids `unsafe`.
# `nix` rather than `rustix`: rustix 1.x has no `getrusage`, and the shim's
# whole reason to exist is `RUSAGE_CHILDREN`.
nix        = { version = "0.30", default-features = false, features = ["resource", "signal", "process"] }
# A SIGTERM from the driver's `abandon` reaches the shim as a flag; the only
# safe way to install a handler.
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
# A tool driver's schema is derived from the type it deserializes with
# (ADR-0006 §5, ADR-0009 §7): one source of truth.
schemars   = { version = "1", features = ["derive"] }

# The reducer is a pure, deterministic fold. `-D warnings` is the floor; the
# lints below are the ones whose violation would be a *correctness* bug in a
# replayable system, so they are denied workspace-wide rather than left to
# review.
[workspace.lints.rust]
unsafe_code             = "forbid"
missing_docs            = "warn"
unreachable_pub         = "warn"
rust_2018_idioms        = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Nondeterminism sources. A HashMap in reducer state is a replay bug that only
# shows up on another platform, which is the most expensive kind.
disallowed_types   = "deny"
disallowed_methods = "deny"
# Panics in the kernel are unrecoverable for every agent in the tree.
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
indexing_slicing    = "deny"
integer_division    = "deny"
