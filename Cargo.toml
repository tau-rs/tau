[workspace]
resolver = "2"
members = [
    "crates/tau-domain",
    "crates/tau-ports",
    "crates/tau-ir",
    "crates/tau-ir-lower",
    "crates/tau-infra",
    "crates/tau-app",
    "crates/tau-pkg",
    "crates/tau-mcp",
    "crates/tau-mcp-tokio",
    "crates/tau-native-tools",
    "crates/tau-runtime-core",
    "crates/tau-observe",
    "crates/tau-runtime-tokio",
    "crates/tau-cli",
    "crates/tau-plugin-protocol",
    "crates/tau-plugin-sdk",
    "crates/tau-plugin-test-support",
    "crates/tau-plugin-conformance",
    "crates/tau-plugin-compat",
    "crates/tau-plugins/echo-llm",
    "crates/tau-plugins/echo-tool",
    "crates/tau-plugins/anthropic",
    "crates/tau-plugins/ollama",
    "crates/tau-plugins/openai",
    "crates/tau-plugins/fs-read",
    "crates/tau-plugins/fs-write",
    "crates/tau-plugins/shell",
    "crates/tau-sandbox-container",
    "crates/tau-sandbox-darwin",
    "crates/tau-sandbox-native",
    "crates/tau-sandbox-proxy",
    "crates/tau-sandbox-windows",
    "crates/tau-ts-extract",
    "crates/tau-workflow",
    "crates/tau-ir-conformance",
    "crates/tau-conformance",
    "crates/tau-wasm-guest",
    "crates/tau-wasm-host",
    "xtask",
]
exclude = [
    "crates/tau-plugin-compat/fixtures/controlled-env-binary",
    # cargo-fuzz harnesses — separate Cargo projects; require nightly
    # Rust + libfuzzer-sys, neither of which should leak into the
    # workspace toolchain. See the README in each fuzz directory.
    "crates/tau-domain/fuzz",
    "crates/tau-pkg/fuzz",
    "crates/tau-plugin-protocol/fuzz",
    # Integration-test fixture — out-of-workspace binary, built on demand.
    "crates/tau-mcp-tokio/tests/fixtures/mock-mcp-server",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LEBOCQTitouan/tau"
authors = ["Titouan Lebocq <75916953+LEBOCQTitouan@users.noreply.github.com>"]

# Centralised lint policy. Every member opts in with `[lints]\nworkspace = true`.
# CI runs `cargo clippy --workspace --all-targets -- -D warnings`, so a lint at
# `"warn"` here is effectively DENIED in CI — this table only contains lints the
# workspace already satisfies. Noisier lints (clippy::pedantic, missing_docs) are
# tracked as backlog and raised in follow-up PRs once their fallout is cleared.
[workspace.lints.rust]
# unsafe is deny-by-default across the workspace; the few crates that genuinely
# need it opt out locally with `#![allow(unsafe_code)]` (tau-sandbox-native,
# tau-wasm-guest) or a scoped `#[allow(unsafe_code)]` (tau-app's PR_SET_PDEATHSIG
# call site). Crates that already declare `#![forbid(unsafe_code)]` keep that
# stricter local level.
unsafe_code = "warn"

[workspace.lints.clippy]
# Already enforced by CI's `-D warnings`; declaring it here makes the policy
# explicit and centrally toggleable.
all = "warn"

[workspace.dependencies]
# β.7.5 wasm guest (wasm32-wasip2 only)
wit-bindgen = { version = "0.58", default-features = false, features = ["macros", "realloc"] }
wit-parser  = "0.251"
dlmalloc    = { version = "0.2", features = ["global"] }
# β.7.5 wasm host (std embedder; host targets only)
wasmtime    = "45"
tau-domain          = { path = "crates/tau-domain", version = "0.0.0", default-features = false }
tau-ports           = { path = "crates/tau-ports",  version = "0.1.0", default-features = false }
tau-ir              = { path = "crates/tau-ir", version = "0.0.0" }
tau-ir-lower        = { path = "crates/tau-ir-lower", version = "0.0.0" }
tau-mcp             = { path = "crates/tau-mcp",       version = "0.0.0", default-features = false }
tau-mcp-tokio       = { path = "crates/tau-mcp-tokio", version = "0.0.0", default-features = false }
tau-native-tools    = { path = "crates/tau-native-tools", version = "0.0.0", default-features = false }
tau-pkg             = { path = "crates/tau-pkg",    version = "0.0.0" }
tau-runtime-core    = { path = "crates/tau-runtime-core", version = "0.0.0" }
tau-runtime-tokio   = { path = "crates/tau-runtime-tokio", version = "0.0.0" }
tau-plugin-protocol = { path = "crates/tau-plugin-protocol", version = "0.0.0" }
tau-plugin-sdk      = { path = "crates/tau-plugin-sdk", version = "0.0.0" }
tau-plugin-test-support = { path = "crates/tau-plugin-test-support", version = "0.0.0" }
tau-plugin-conformance  = { path = "crates/tau-plugin-conformance",  version = "0.0.0" }
tau-sandbox-native      = { path = "crates/tau-sandbox-native",      version = "0.0.0" }
tau-sandbox-container   = { path = "crates/tau-sandbox-container",   version = "0.0.0" }
tau-sandbox-darwin      = { path = "crates/tau-sandbox-darwin",      version = "0.0.0" }
tau-sandbox-windows     = { path = "crates/tau-sandbox-windows",     version = "0.0.0" }
tau-sandbox-proxy       = { path = "crates/tau-sandbox-proxy",       version = "0.0.0" }
tau-workflow            = { path = "crates/tau-workflow",            version = "0.0.0" }
tau-app                 = { path = "crates/tau-app",                 version = "0.0.0" }
tau-observe             = { path = "crates/tau-observe",             version = "0.0.0" }
# `default-features = false` on these aliases so no_std members can honour
# their `default-features = false` declarations (cargo silently IGNORES a
# member's `default-features = false` unless the workspace alias also sets
# it). Universally-wanted, no_std-safe sub-features (serde `derive`, tracing
# `attributes`, chrono `serde`/`alloc`) stay in the alias; `std`/`clock` are
# opt-in per consumer.
thiserror       = { version = "2", default-features = false }
semver          = { version = "1", default-features = false }
uuid            = { version = "1", default-features = false, features = ["v7"] }
url             = "2"
serde           = { version = "1", default-features = false, features = ["derive"] }
serde_json      = { version = "1", default-features = false, features = ["alloc"] }
sha2            = { version = "0.11", default-features = false }
base64          = { version = "0.22", default-features = false, features = ["alloc"] }
proptest        = "1"
assert_matches  = "1"
rstest          = "0.26"
walkdir         = "2"
globset         = "0.4"
regex           = "1"
jsonschema      = "0.46"
schemars        = { version = "1", default-features = false }
foldhash     = { version = "0.2", default-features = false }
futures-core    = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util    = { version = "0.3", default-features = false }
hashbrown    = { version = "0.17", default-features = false, features = ["default-hasher"] }
toml            = "1.1"
fs4             = "0.8"
humantime-serde = "1"
tempfile        = "3"
tracing         = { version = "0.1", default-features = false, features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmp-serde       = "1"
rmpv            = { version = "1", features = ["with-serde"] }
bytes           = "1"
anyhow          = "1"
async-trait     = "0.1"
futures         = "0.3"
insta           = { version = "1", features = ["json"] }
dashmap         = "6"
tokio-util      = { version = "0.7", features = ["rt"] }
chrono          = { version = "0.4", default-features = false, features = ["serde", "alloc"] }
tokio           = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-util", "io-std", "process", "sync", "time"] }
reqwest             = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
wiremock        = "0.6"
eventsource-stream  = "0.2"
async-stream        = "0.3"
secrecy             = "0.10"
zeroize             = { version = "1", default-features = false, features = ["alloc"] }
landlock     = "0.4"
libc         = "0.2"
nix          = { version = "0.31", default-features = false, features = ["sched", "user", "process", "fs"] }
seccompiler  = "0.5"
ulid         = { version = "1", default-features = false }

# Vendored no_std fork of async-stream (upstream 0.3.6 is std-only via
# `thread_local!` + `use std::`). Required so the β.7.5 wasm guest can link
# `tau-runtime-core::run_ir_streaming`. See vendor/async-stream/Cargo.toml for
# the full rationale; delete this patch + the vendored crate once upstream
# (tokio-rs/async-stream) ships no_std.
[patch.crates-io]
async-stream = { path = "vendor/async-stream" }
